<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlowerLogix · Analítica Sede JN</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    .topbar { min-height: 135px; }
    .home-section { margin-top:24px; padding-top:15px; border-top:1px solid var(--border); }
    .home-section-heading { display:flex; justify-content:space-between; gap:12px; align-items:center; }
    .home-section-heading h3 { margin:0; font-size:1.08rem; }
    .home-area-link { color:var(--green); font-weight:700; font-size:.74rem; text-decoration:none; }
    .menu-btn { display:block; text-decoration:none; }
    .module-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(225px,1fr)); gap:14px; margin-top:20px; }
    .module-link { display:flex; align-items:center; justify-content:space-between; gap:12px; border:1px solid var(--border);
      border-radius:15px; background:#fbfdfc; padding:20px 16px; color:var(--text); text-decoration:none; min-height:94px; }
    .module-link:hover,.module-link:focus-visible { border-color:var(--green); background:var(--green-soft); outline-offset:2px; }
    .module-link strong { font-size:.86rem; }
    .module-link small { display:block; color:var(--muted); font-size:.65rem; margin-bottom:7px; }
    .module-icon { display:grid; place-items:center; min-width:36px; height:36px; border-radius:11px; background:var(--green-soft); font-size:1.15rem; }
    /* Nivel 1: las secciones Rendimiento, Calidad e Indicadores son navegación,
       no filtros. Mantener otras páginas sin selector de modalidad intactas. */
    /* Rendimiento / Calidad / Indicadores: misma identidad en TODOS los módulos.
       Verde sólido = vista activa; verde casi blanco = otras vistas.
       Los filtros conservan un tono verde intermedio para mantener la jerarquía. */
    .analysis-tabs { display:flex; flex-wrap:wrap; align-items:center; gap:9px; padding:0 0 13px; margin-top:18px; margin-bottom:16px; border-bottom:1px solid var(--border); }
    .analysis-tab { padding:10px 20px; min-width:143px; min-height:42px; border-radius:12px; border:1px solid #cfdfd4; background:#f1f6f3; color:#173c29; font:inherit; font-size:.79rem; font-weight:800; cursor:pointer; box-shadow:none; transition:background .15s ease,border-color .15s ease; }
    .analysis-tab:hover:not(.active) { border-color:#a4c5b0; background:#e8f2eb; }
    .analysis-tab.active { background:#197447; color:#fff; border-color:#197447; box-shadow:none; }
    .analysis-tab:focus-visible { outline:2px solid var(--green); outline-offset:2px; }
    /* El diseño de las tres pestañas también se aplica en módulos con
       segundo nivel de navegación (Pompón, Spider, Malla y Corte). */
    .layered-primary-tabs {gap:9px;align-items:center;margin:16px 0 14px;padding:0 0 13px;border-bottom:1px solid #dce8df;}
    .layered-primary-tabs .analysis-tab {min-width:143px;min-height:42px;padding:10px 20px;border:1px solid #cfdfd4;border-radius:12px;background:#f1f6f3;color:#173c29;font-size:.79rem;font-weight:800;box-shadow:none;}
    .layered-primary-tabs .analysis-tab:hover:not(.active) {border-color:#a4c5b0;background:#e8f2eb;color:#173c29;}
    .layered-primary-tabs .analysis-tab.active {background:#197447;color:#fff;border-color:#197447;box-shadow:none;}
    /* Nivel 2: selector compacto de modalidad, visualmente distinto de las pestañas. */
    .operation-selector {display:flex;align-items:center;flex-wrap:wrap;gap:13px;margin:0 0 19px;padding:9px 12px;border:1px solid #e5ede8;border-radius:12px;background:#f9fbfa;}
    .operation-selector-label {flex:0 0 auto;color:#7a8980;font-size:.63rem;font-weight:850;letter-spacing:.095em;}
    .operation-tabs {display:flex;align-items:center;flex-wrap:wrap;gap:3px;padding:3px;margin:0;border:1px solid #e1e9e3;border-radius:10px;background:#eff3f0;}
    .operation-tab {flex:0 1 auto;min-height:34px;padding:7px 12px;border:1px solid transparent;border-radius:7px;background:transparent;font:inherit;color:#526b5b;font-size:.73rem;font-weight:700;cursor:pointer;white-space:normal;}
    .operation-tab:hover {background:#f9fdfa;color:#205f3f;border-color:#dce8df;}
    .operation-tab.active {background:#fff;color:#175e3c;border-color:#bed5c4;box-shadow:0 1px 3px rgba(22,75,44,.07);font-weight:800;}
    .operation-tab.active::before {content:"";display:inline-block;width:6px;height:6px;margin-right:7px;border-radius:50%;background:#288255;vertical-align:middle;}
    .operation-tab:focus-visible {outline:2px solid var(--green);outline-offset:2px;}
    /* Indicadores: separar subtipo de indicador de pestañas de sección */
    .indicator-section-nav {display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:11px 0 15px;padding:8px 12px;border:1px solid #e3ebe5;border-radius:11px;background:#f9fbfa;}
    .indicator-section-caption {flex:0 0 auto;font-size:.63rem;letter-spacing:.075em;font-weight:850;color:#788c7e;}
    .indicator-subtabs {display:flex;flex-wrap:wrap;gap:3px;margin:0;padding:3px;border:1px solid #e0eae2;border-radius:8px;background:#eef4ef;}
    .indicator-subtab {min-width:0;min-height:32px;padding:7px 12px;border:1px solid transparent;border-radius:6px;background:transparent;color:#5e7665;font:inherit;font-size:.72rem;font-weight:750;cursor:pointer;}
    .indicator-subtab:hover {color:#17633e;background:#f8fcf8;border-color:#e4ebe5;}
    .indicator-subtab.active {background:#fff;color:#17633e;border-color:#c4dccb;box-shadow:0 1px 2px rgba(21,70,38,.05);}
    .indicator-subtab:focus-visible { outline:2px solid var(--green); outline-offset:2px; }
    .dash-filter-panel {border:1px solid #e0ebe3;border-radius:13px;background:#fafcfb;padding:13px 15px;margin:6px 0 17px;}
    .dash-filter-caption {display:block;font-size:.64rem;font-weight:850;letter-spacing:.09em;color:#687f70;margin:0 0 10px;}
    .dash-controlbar {display:flex;align-items:end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin:0;}
    .dash-controlgroup {display:flex;gap:10px;flex-wrap:wrap;align-items:end;}
    .dash-control-actions {display:flex;align-items:center;padding-left:12px;border-left:1px solid #e0e9e2;}
    .dash-control-actions button {font-size:.7rem;min-height:36px;padding:8px 11px;}
    /* Indicadores de Calidad: filtros de períodos con multiselección. */
    .dash-quality-fields{display:grid;grid-template-columns:repeat(2,minmax(155px,240px)) minmax(130px,200px);align-items:end;gap:12px;flex:1 1 450px;min-width:0}
    .dash-quality-fields:not(:has(#dashRole)){grid-template-columns:repeat(2,minmax(155px,260px))}
    .dash-quality-field{display:flex;flex-direction:column;gap:6px;min-width:0}
    .dash-quality-label{font-size:.69rem;color:#465c50;font-weight:750}
    .dash-quality-dropdown .q-filter-trigger{min-height:40px;box-sizing:border-box;padding:8px 32px 8px 11px}
    .dash-quality-dropdown .q-filter-trigger strong{font-size:.75rem}
    .dash-quality-dropdown.is-specific .q-filter-trigger{background:#cfe8d8;border-color:#97c2a7}
    .dash-quality-dropdown .q-filter-popup{left:0;right:auto;transform:none;width:max(100%,285px);max-width:min(420px,calc(100vw - 44px))}
    .dash-quality-fields>.dash-quality-field:nth-child(2) .q-filter-popup{left:auto;right:0}
    .dash-quality-dropdown .q-check-options{max-height:210px;overflow-y:auto}
    .dash-quality-dropdown .q-choice{flex:0 1 auto}
    .dash-quality-dropdown .q-choice input{width:15px;max-width:15px;margin:0;padding:0}
    .dash-quality-fields>label select{box-sizing:border-box;width:100%;max-width:none;min-height:40px}
    .dash-quality-summary{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin-top:13px;padding-top:11px;border-top:1px solid #e0e9e2;color:#3d624c;font-size:.72rem}
    .dash-quality-selected{flex:1 1 300px;min-width:0;overflow-wrap:anywhere;line-height:1.6}
    .dash-quality-count{margin-left:auto;color:#145a38;font-weight:800;white-space:nowrap}
    @media(max-width:720px){.dash-quality-fields,.dash-quality-fields:not(:has(#dashRole)){grid-template-columns:repeat(2,minmax(0,1fr));flex:1 1 100%}.dash-quality-fields>label{grid-column:1/-1}.dash-quality-count{margin-left:0}}
    @media(max-width:480px){.dash-quality-dropdown .q-filter-popup{position:static;left:auto!important;right:auto!important;transform:none;width:100%;max-width:none;box-shadow:0 5px 14px rgba(24,64,40,.08);margin-top:5px}}
    .dash-controlgroup label { display:flex; flex-direction:column; gap:5px; font-size:.69rem; font-weight:700; color:#465c50; }
    .dash-controlgroup input,.dash-controlgroup select { background:#fff; padding:9px; border-radius:9px; border:1px solid var(--border); max-width:210px; font-size:.73rem; color:var(--text); }
    .dash-kpis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin:14px 0 20px; }
    .kpi-card { display:flex; flex-direction:column; gap:5px; padding:17px 16px; min-height:118px; border-radius:14px; border:1px solid var(--border); background:linear-gradient(150deg,#fbfdfc,#f3f9f5); }
    .kpi-card span { color:#62776b; font-size:.73rem; font-weight:700; }
    .kpi-card strong { color:#166943; font-size:1.65rem; font-weight:850; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
    .kpi-card small { font-size:.65rem; color:#7a857f; line-height:1.4; }
    .dash-graphs { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin:18px 0; }
    .dash-graph { border:1px solid var(--border); background:#fff; border-radius:15px; padding:14px; min-width:0; box-shadow:0 5px 14px rgba(15,50,31,.025); }
    .dash-graph:last-child:nth-child(odd) { grid-column:1/-1; }
    .dash-graph-heading { display:flex; flex-wrap:wrap; gap:6px; align-items:baseline; justify-content:space-between; margin:0 0 12px; }
    .dash-graph-heading h4 { font-size:.84rem; color:#203c2c; margin:0; }
    .dash-graph-heading span { font-size:.67rem; color:#6b7b71; }
    .dash-svg { display:block; width:100%; height:auto; min-height:140px; }
    .dash-no-data { display:grid; place-items:center; padding:30px 15px; min-height:165px; text-align:center; color:#708477; font-size:.72rem; background:#fafcfb; border-radius:10px; }
    .dash-sample { border:1px solid #efd39d; background:#fff7e7; color:#684a19; padding:12px 15px; border-radius:12px; font-size:.72rem; line-height:1.5; }
    .dash-sample strong { margin-right:8px; }
    .dash-executive-text { margin:15px 0; padding:16px; border:1px solid var(--border); border-radius:13px; background:#f8fbf9; font-size:.75rem; line-height:1.6; color:#435f4e; }
    .dash-executive-text strong { font-size:.8rem; color:#1a4a32; }
    .dash-executive-text p { margin:6px 0 0; }
    @media(max-width:1150px){.dash-kpis { grid-template-columns:repeat(2,minmax(0,1fr)); }}
    @media(max-width:780px){.dash-graphs { grid-template-columns:1fr; }.dash-graph:last-child:nth-child(odd){grid-column:auto;} }
    @media(max-width:460px){.dash-kpis { grid-template-columns:1fr; }.dash-controlgroup label,.dash-controlgroup input,.dash-controlgroup select{max-width:none;width:100%} }

    .executive-summary-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:18px; }
    .executive-summary-section { border:1px solid var(--border); border-radius:13px; padding:16px; background:#fbfdfc; }
    .executive-summary-section h4 { font-size:.82rem; margin:0 0 12px; color:var(--text); }
    .executive-summary-section p { font-size:.72rem; margin:8px 0; color:var(--muted); }
    @media (max-width:650px) { .executive-summary-grid { grid-template-columns:1fr; } }

    .analysis-metrics { grid-template-columns:repeat(4,minmax(0,1fr)); }
    @media(max-width:880px) { .analysis-metrics { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media(max-width:480px) { .analysis-tab { min-width:0; flex:1 1 auto; padding:10px; } }
    .module-heading { display:flex; align-items:start; justify-content:space-between; flex-wrap:wrap; gap:12px; }
    .back-link { display:inline-flex; gap:7px; align-items:center; text-decoration:none; }
    .module-filters {display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:18px 0;}
    .module-filters-organized {align-items:stretch;justify-content:space-between;gap:14px;border:1px solid #e0ebe3;border-radius:13px;background:#fafcfb;padding:14px;}
    .module-filter-fields {flex:1 1 400px;min-width:0;}
    .module-filter-caption {display:block;margin:0 0 10px;font-size:.63rem;font-weight:850;letter-spacing:.09em;color:#687f70;}
    .module-filter-inputs {display:flex;gap:10px;flex-wrap:wrap;align-items:end;}
    .module-filter-actions {display:flex;gap:7px;align-items:end;flex-wrap:wrap;align-content:end;}
    .module-filter-actions .btn-secondary {display:inline-flex;justify-content:center;align-items:center;min-height:36px;padding:8px 12px;border:1px solid #d4e3d8;background:white;color:#3b674d;font-size:.7rem;font-weight:750;}
    .module-filter-actions .btn-secondary:hover {background:#eef6f0;}
    .module-filters label { display:flex; flex-direction:column; gap:5px; font-size:.68rem; color:var(--muted); }
    .module-filters input { border:1px solid var(--border); border-radius:10px; padding:9px; background:#fff; color:var(--text); max-width:190px; }
    .module-summary { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin:18px 0; }
    .module-stat { background:#fbfdfc; border:1px solid var(--border); padding:17px; border-radius:13px; }
    .module-stat span { display:block; font-size:.68rem; color:var(--muted); }
    .module-stat strong { display:block; margin-top:8px; font-size:1.65rem; color:var(--green); }
    .module-notice { margin-top:15px; padding:12px; border:1px solid var(--border); border-radius:12px; font-size:.72rem; color:var(--muted); background:#fbfdfc; }
    .module-tablewrap { margin-top:16px; max-width:100%; overflow:auto; border:1px solid var(--border); border-radius:12px; }
    .module-table { border-collapse:collapse; width:100%; min-width:560px; font-size:.7rem; }
    .module-table th,.module-table td { padding:11px; border-bottom:1px solid var(--border); text-align:left; white-space:pre-wrap; vertical-align:top; }
    .module-table th { background:#f2f7f4; white-space:nowrap; }

    .quality-demo-banner{display:flex;flex-direction:column;gap:4px;margin:12px 0 16px;border:1px solid #edcd85;border-radius:12px;padding:13px 15px;background:#fff5da;color:#6b4810;font-size:.75rem}
    .quality-demo-banner strong{font-size:.75rem;letter-spacing:.025em}
    .quality-demo-banner[hidden]{display:none}
    .quality-heading{font-size:1.02rem;margin:10px 0 14px}

    /* Calidad: subnavegación de contenido, no otro menú principal */
    .q-modebar {display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 18px;padding:0 0 9px;border-bottom:1px solid #e0ebe3;}
    .q-modebar .q-mode-btn {display:inline-flex;align-items:center;justify-content:center;min-height:39px;padding:9px 17px;border:1px solid #d9e5dd;border-radius:9px;background:#f4f7f5;color:#587063;font:inherit;font-size:.77rem;font-weight:750;cursor:pointer;transition:background-color .18s,border-color .18s,color .18s,box-shadow .18s;}
    .q-modebar .q-mode-btn:hover:not(.active) {background:#e6f4e9;border-color:#bdd6c4;color:#17643f;}
    .q-modebar .q-mode-btn.active,
    .q-modebar .q-mode-btn[aria-pressed="true"] {background:#b9f5b0!important;border:1px solid #7edc72!important;color:#145a32!important;box-shadow:0 0 0 2px rgba(126,220,114,.18)!important;}
    .q-modebar .q-mode-btn.active:hover {background:#aaf2a1;}
    .q-mode-btn:focus-visible,.q-select-actions button:focus-visible {outline:2px solid var(--green);outline-offset:2px}
    #qExplorePane[hidden],#qReportPane[hidden] {display:none !important}
    .q-explore-pane {display:block;}
    .q-explore-header {display:flex;align-items:start;gap:16px;justify-content:space-between;flex-wrap:wrap;margin:0 0 16px;}
    .q-explore-header h3 {font-size:1rem;margin:0 0 6px}
    .q-explore-header p {font-size:.72rem;color:var(--muted);margin:0;line-height:1.55}
    .q-explore-controls {margin:10px 0 12px;padding:15px 16px 13px;border:1px solid #e1eae3;border-radius:13px;background:#fafcfb;}
    .q-explore-filter-caption {display:block;font-size:.64rem;font-weight:850;letter-spacing:.09em;color:#657b6c;}
    .q-explore-primary {display:flex;align-items:end;flex-wrap:wrap;gap:10px;margin:11px 0 13px;max-width:900px;}
    .q-explore-primary label {display:flex;flex-direction:column;flex:1 1 270px;max-width:460px;gap:6px;font-size:.72rem;font-weight:750;color:#395747;}
    .q-explore-variants {display:flex;align-items:center;flex-wrap:wrap;gap:3px;padding:3px;background:#eef4ef;border:1px solid #dee8e0;border-radius:8px;}
    .q-variant-btn {min-height:32px;padding:6px 10px;border:1px solid transparent;background:transparent;border-radius:6px;color:#617767;cursor:pointer;font:inherit;font-size:.7rem;font-weight:700;}
    .q-variant-btn.active {background:#fff;border-color:#c7daca;box-shadow:0 1px 3px rgba(21,75,38,.05);color:#17633e;}
    .q-variant-btn:focus-visible {outline:2px solid var(--green);outline-offset:2px;}
    .q-explore-primary input,.q-explore-primary select {width:100%;border:1px solid #c9dbd0;border-radius:10px;padding:11px 12px;background:#fff;color:var(--text);font-size:.75rem;}
    .q-select-actions button {border:1px solid #c8dacf;background:#fff;color:#256043;cursor:pointer;padding:8px 11px;border-radius:9px;font-size:.7rem;font-weight:750;}
    .q-select-actions button:hover {background:#e1f2e7;border-color:var(--green)}
    .q-explore-filters {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:6px 0 10px;align-items:start;position:relative;z-index:10;}
    .q-filter-dropdown {position:relative;min-width:0;}
    .q-filter-dropdown[open] {z-index:15;}
    .q-filter-trigger {min-height:48px;cursor:pointer;list-style:none;display:flex;flex-direction:column;gap:3px;justify-content:center;border:1px solid #d8e3db;border-radius:9px;background:#fff;padding:8px 36px 8px 12px;position:relative;}
    .q-filter-trigger::-webkit-details-marker {display:none;}
    .q-filter-trigger::marker {content:"";}
    .q-filter-trigger::after {content:"";position:absolute;right:17px;top:calc(50% - 4px);width:8px;height:8px;border-right:2px solid #3a6849;border-bottom:2px solid #3a6849;transform:rotate(45deg);transition:transform .15s;}
    .q-filter-dropdown[open] .q-filter-trigger {border-color:var(--green);background:#f1faf4;border-bottom-left-radius:8px;border-bottom-right-radius:8px;}
    .q-filter-dropdown[open] .q-filter-trigger::after {transform:rotate(225deg);}
    .q-filter-trigger span {display:block;font-size:.69rem;color:#456853;font-weight:800;}
    .q-filter-trigger strong {display:block;font-size:.77rem;color:#174e33;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
    .q-filter-trigger:focus-visible {outline:2px solid var(--green);outline-offset:3px;}
    .q-filter-popup {position:absolute;top:calc(100% + 6px);left:0;z-index:30;width:max(100%,340px);max-width:min(520px,calc(100vw - 56px));max-height:310px;overflow-y:auto;border:1px solid #b9d0c0;background:#fff;border-radius:12px;padding:13px;box-shadow:0 14px 32px rgba(24,64,40,.17);}
    .q-filter-dropdown:nth-child(2) .q-filter-popup {left:50%;transform:translateX(-50%);}
    .q-filter-items .q-filter-popup {left:auto;right:0;width:max(100%,490px);}
    .q-filter-popup .q-select-actions {margin-bottom:12px;}
    .q-filter-popup .q-check-options {max-height:225px;overflow-y:auto;}
    .q-filter-popup .q-item-options {max-height:225px;}
    .q-filter-popup .q-choice {flex:0 1 auto;}
    .q-filter-popup .q-item-options .q-choice {flex:1 1 195px;}

    .q-check-options {display:flex;gap:6px;flex-wrap:wrap;max-height:155px;overflow-y:auto;align-content:flex-start;}
    .q-item-options {max-height:185px;}
    .q-choice {display:inline-flex;align-items:center;gap:6px;max-width:100%;border:1px solid #d9e6dd;border-radius:8px;padding:7px 9px;background:#fff;color:#2b4d37;font-size:.69rem;line-height:1.4;cursor:pointer;}
    .q-choice:hover {background:#edf7ef}
    .q-choice:has(input:checked){border-color:#76ac88;background:#eaf6ed}
    .q-choice input {width:15px;height:15px;flex-shrink:0;accent-color:var(--green);margin:0;}
    .q-week-options .q-choice {min-width:61px;}
    .q-item-options .q-choice {flex:1 1 160px;}
    .q-select-actions {display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px;}
    .q-explore-feedback {font-size:.75rem;color:#3d5f48;line-height:1.5;margin:13px 0;padding:11px 13px;border:1px solid var(--border);background:#f6faf7;border-radius:10px;}
    /* Calidad/Comparativo: mismos controles compactos de Rendimiento. */
    .q-compare-controls{padding:14px 17px 12px}
    .q-compare-heading{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:14px}
    .q-compare-heading p{margin:5px 0 0;font-size:.69rem;color:#72877a}
    .q-compare-filter-fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}

function period(r){

function compareWeekDays(value){

 if(!match)return [];
 const year=Number(match[1]),week=Number(match[2]);
 if(week<1||week>53)return [];
 const january4=new Date(Date.UTC(year,0,4));
 const monday=new Date(Date.UTC(year,0,4-((january4.getUTCDay()+6)%7)+7*(week-1)));
 const days=Array.from({length:7},(_,i)=>{
  const current=new Date(monday);current.setUTCDate(monday.getUTCDate()+i);

function evaluate(r,config,items){
 const raw=Array.isArray(r.fallosDetalle)?r.fallosDetalle:
   Array.isArray(r.incumplimientos)?r.incumplimientos:
   Array.isArray(r.items)?r.items:Array.isArray(r.failures)?r.failures:
   Array.isArray(r.detalles)?r.detalles:Array.isArray(r.observaciones)?r.observaciones:[];
 const values=raw.length?raw:(Array.isArray(r.itemsNombres)?r.itemsNombres:[]);
 const ids=new Map(items.map(([id,name])=>[String(id),String(id)]));
 const names=new Map(items.map(([id,name])=>[norm(name),String(id)]));
 const failed=new Set();let unknown=false;
 for(const v of values){
   if(v&&typeof v==="object"&&v.cantidad!==undefined&&Number(v.cantidad)<=0)continue;
   const item=v&&typeof v==="object"?v.idItemDocumento??v.idItem??v.itemId??v.id??v.item??v.nombre??v.name??v.idObservacion:v;
   const txt=String(item??"").trim();
   if(!txt)continue;
   if(config.conformIds.includes(txt)||/^(ramo\s+)?conforme$/.test(norm(txt)))continue;
   const found=ids.get(txt)||names.get(norm(txt));
   if(found)failed.add(found);else unknown=true;
 }
 return {failed,unknown};
}

function compareSvg(series,periodLabels){
 const active=series.filter(s=>s.values.some(v=>v!==null&&Number.isFinite(v)));
 if(!active.length||!periodLabels.length)return '<p class="q-explore-empty">No hay suficientes evaluaciones para dibujar la comparación.</p>';
 const w=940,h=320,left=50,right=18,top=24,bottom=58,plotW=w-left-right,plotH=h-top-bottom;
 const sx=i=>left+(periodLabels.length===1?plotW/2:i*plotW/(periodLabels.length-1));
 const sy=value=>top+plotH-Math.max(0,Math.min(100,value))/100*plotH;
 const palette=["#147b4b","#3264a8","#b57122","#9a4b8c","#37868a","#6c8437"];
 let svg=[];
 for(let tick=0;tick<=4;tick++){
  const value=tick*25,y=sy(value);
  svg.push('<line x1="'+left+'" x2="'+(w-right)+'" y1="'+y+'" y2="'+y+
    '" stroke="#dbe8df" stroke-dasharray="4 5"/>');
  svg.push('<text x="'+(left-9)+'" y="'+(y+4)+'" text-anchor="end" font-size="13" fill="#64766b">'+value+'%</text>');
 }
 periodLabels.forEach((name,i)=>{
  if(periodLabels.length>15&&i%2===1)return;
  const x=sx(i);
  svg.push('<text x="'+x+'" y="'+(h-20)+'" text-anchor="end" transform="rotate(-28 '+x+' '+(h-20)+
  ')" font-size="11" fill="#556d5f">'+esc(name)+'</text>');
 });
 active.slice(0,5).forEach((set,index)=>{
  const color=palette[index%palette.length],pieces=[];let points=[];
  set.values.forEach((v,i)=>{
   if(v===null||!Number.isFinite(v)){if(points.length)pieces.push(points);points=[];return;}
   points.push([sx(i),sy(v)]);
  });
  if(points.length)pieces.push(points);
  pieces.forEach(p=>svg.push('<polyline points="'+p.map(v=>v.join(",")).join(" ")+
   '" stroke="'+color+'" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>'));
  set.values.forEach((v,i)=>{
   if(v===null||!Number.isFinite(v))return;
   const x=sx(i),y=sy(v);
   svg.push('<circle cx="'+x+'" cy="'+y+'" r="4" fill="'+color+'"><title>'+
     esc(set.label+' · '+periodLabels[i]+': '+Math.round(v*10)/10+'%')+'</title></circle>');
  });
 });
 return '<div class="q-explore-legend">'+active.slice(0,5).map((set,i)=>
   '<span><i style="background:'+palette[i%palette.length]+'"></i>'+esc(set.label)+'</span>').join("")+'</div>'+
   '<svg class="q-explore-chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Evolución de conformidad por ítem y período">'+
   svg.join("")+'</svg>'+
   (active.length>5?'<p class="q-explore-help">El gráfico muestra cinco ítems como máximo; la tabla incluye todos los seleccionados.</p>':"");
}
function analyzeComparison(rows,group,items,selectedIds,years,weeks,exactPeriods,search,selectedDays=null){
 const validIds=new Set(items.map(x=>x[0]));
 const chosen=items.filter(([id])=>selectedIds.has(id)&&validIds.has(id));
 const out=new Map(),invalid=[];
 rows.forEach(r=>{
  if(!real(r))return;
  const [year,week]=period(r);
  if(!year||!week)return;
  const per=year+'-'+String(week).padStart(2,"0");
  if(exactPeriods!==null&&!exactPeriods.has(per))return;
  if(exactPeriods===null&&((years!==null&&!years.has(year))||(weeks!==null&&!weeks.has(week))))return;
  if(search&&!norm(worker(r)+' '+(r.colaborador??r.sembrador??r.empleado??"")).includes(norm(search)))return;
  if(selectedDays!==null&&selectedDays!==""){
   const stamp=date(r);
   if(typeof selectedDays==="string"){if(stamp!==selectedDays)return;}
   else{
    if(!/^\d{4}-\d{2}-\d{2}$/.test(stamp))return;
    const d=new Date(stamp+"T12:00:00Z");
    if(!Number.isFinite(d.getTime())||!selectedDays.has((d.getUTCDay()+6)%7))return;
   }
  }
  const ev=evaluate(r,group,items);
  if(ev.unknown){invalid.push(r);return;}
  let row=out.get(per);
  if(!row){row={year,week,label:year+' · S'+String(week).padStart(2,"0"),n:0,overall:0,selected:0,ids:new Map(chosen.map(([id])=>[id,0]))};out.set(per,row)}
  row.n++;
  if(!ev.failed.size)row.overall++;
  if(!chosen.some(([id])=>ev.failed.has(id)))row.selected++;
  for(const [id] of chosen)if(!ev.failed.has(id))row.ids.set(id,row.ids.get(id)+1);
 });
 return {periods:[...out.values()].sort((a,b)=>a.year-b.year||a.week-b.week),chosen,excluded:invalid.length};
}

function calc(records,group,items){
 const people=new Map();let excluded=0;
 for(const r of records){
   const failure=evaluate(r,group,items);
   if(failure.unknown){excluded++;continue;}
   const id=String(r.colaborador||r.sembrador||r.empleado||worker(r)||"Sin código");
   if(!people.has(id))people.set(id,{name:worker(r)||id,id,samples:0,pass:0,issues:new Map(items.map(([item])=>[item,0]))});
   const p=people.get(id);p.samples++;if(!failure.failed.size)p.pass++;
   for(const id of failure.failed)p.issues.set(id,p.issues.get(id)+1);
 }
 return {rows:[...people.values()].sort((a,b)=>a.name.localeCompare(b.name,"es")),excluded};
}

     const n=(year-2020)*3+week*5+personIndex*7+revision+roleIndex*3;

      revision:revision+1,incumplimientos:fails,esMuestraReal:true,__soloDemostracion:true});
    }
 }
 return rows;
}

  const script=document.createElement("script");

  script.async=true;

function qualityPDFLogo(url){
 if(typeof Image==="undefined")return Promise.resolve(null);
 return new Promise(resolve=>{
  const image=new Image();
  image.crossOrigin="anonymous";
  image.onload=()=>{
   try{
    const canvas=document.createElement("canvas");
    canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;
    if(!canvas.width||!canvas.height)throw Error("Logo vacío");
    canvas.getContext("2d").drawImage(image,0,0);
    resolve({data:canvas.toDataURL("image/png"),ratio:canvas.width/canvas.height});
   }catch{resolve(null)}
  };
  image.onerror=()=>resolve(null);
  image.src=url;
 });
}

function qualityWeeklyGraph(weeks){

  const height=y(mark);
  lines.push('<line x1="'+L+'" x2="'+(W-R)+'" y1="'+height+'" y2="'+height+
   '" stroke="#d7ded8" stroke-width=".85" stroke-dasharray="4 4"/>'+
   '<text x="'+(L-9)+'" y="'+(height+4)+'" font-size="11" text-anchor="end" fill="#4b6253">'+mark+'%</text>');
 }
 weeks.forEach((row,i)=>{
  const share=plotW/weeks.length,x=L+i*share+share*.25,width=Math.min(75,share*.5);
  const level=row.n?100*row.pass/row.n:0,barY=y(level);

 });
 return '<svg class="quality-paper-chart" role="img" aria-label="Gráfica de conformidad grupal semanal" viewBox="0 0 '+W+' '+H+'">'+

   for(const row of all){
     const [yr,week]=period(row);
     if(!yr||!week)continue;
     const k=yr+'-'+String(week).padStart(2,"0");
     if(!periodsOfRows.has(k))periodsOfRows.set(k,{yr,week,records:[]});
     periodsOfRows.get(k).records.push(row);
   }
   const chronological=[...periodsOfRows.values()].sort((a,b)=>a.yr-b.yr||a.week-b.week);
   // El informe presenta una sola semana, no el conjunto de semanas del análisis.

   // cualquier año y semana que tenga registros para esta modalidad.
   const years=[...new Set(chronological.map(p=>p.yr))].sort((a,b)=>b-a);
   const chosenYear=years.includes(Number(reportYear.value))?
     Number(reportYear.value):years[0]??null;

     '<option value="">Sin años con evaluaciones</option>';

     if(!Array.isArray(list)||list.length>20000||!list.every(x=>x&&typeof x==="object"&&!Array.isArray(x)))
       throw Error("Se espera una lista JSON de registros (máximo 20.000).");

     storedRows=list.map(x=>({...x,__calidadGrupo:rowRole(x,groups)||selectedGroup}));
     records=storedRows;demoMode=false;
     localStorage.setItem(key(areaId,storageKey),JSON.stringify(storedRows));
     note.textContent=records.length+" evaluaciones importadas localmente. Los registros sin modalidad se asignaron a "+groups[selectedGroup].label+". Sin conexión automática a Producción.";
     periods();refresh();syncExplore(true,true);

    " "+(total===1?"evaluación":"evaluaciones")+'</strong>';
  if(!chosen.length){
   xresult.innerHTML='<div class="q-explore-empty">Selecciona al menos un ítem para comparar sus resultados.</div>';
   return;
  }
  const metrics='<div class="quality-stats q-explore-stats">'+
   '<div class="module-stat"><span>Evaluaciones comparadas</span><strong>'+fmt.format(total)+'</strong></div>'+
   '<div class="module-stat"><span>Conformidad de ítems seleccionados</span><strong>'+format(chosenOk,total)+'</strong></div>'+
   '<div class="module-stat"><span>Conformidad total (todos los ítems)</span><strong>'+format(overall,total)+'</strong></div>'+
   '</div>';
  const th=['AÑO','SEMANA','EVALUACIONES',...chosen.map(row=>row[1]),'CONFORMIDAD SELECCIONADA'];
  const header='<tr>'+th.map(v=>'<th>'+esc(v)+'</th>').join("")+'</tr>';
  const cells=periods.length?periods.map(r=>'<tr><td>'+r.year+'</td><td>S'+
    String(r.week).padStart(2,"0")+'</td><td>'+r.n+'</td>'+
    chosen.map(([id])=>'<td>'+format(r.ids.get(id),r.n)+'</td>').join("")+
    '<td><strong>'+format(r.selected,r.n)+'</strong></td></tr>').join(""):
    '<tr><td colspan="'+th.length+'" class="module-empty">No hay evaluaciones para los años, semanas, ítems y colaborador seleccionados.</td></tr>';
  xresult.innerHTML=metrics+'<div class="q-explore-visual"><h4>Evolución de conformidad por período</h4>'+
   '<p>Cada línea representa un ítem. Los valores corresponden al porcentaje de evaluaciones sin incumplimiento del ítem.</p>'+
   compareSvg(series,labels)+'</div>'+
   '<div class="module-tablewrap q-explore-table"><table class="module-table"><thead>'+header+
   '</thead><tbody>'+cells+'</tbody></table></div>'+
   '<p class="q-explore-help">La conformidad seleccionada exige que una evaluación no presente fallas en ninguno de los ítems elegidos. '+
   'La conformidad total considera todos los ítems del formulario, aunque solo compares uno. '+
   'Los períodos sin evaluaciones no generan porcentajes.'+
   (excluded?' Se excluyeron '+excluded+' evaluaciones con fallas sin identificar.':'')+'</p>';
 }
 syncExplore=renderChoices;
 periods();refresh();renderChoices(true);
 styleModeButton(xa,false);
 styleModeButton(xi,true);

}
window.QualityReports={render,calc,evaluate,analyzeComparison,config:CONFIG,sampleQualityRecords,demoItems};
})();
</script>
  <script>
/* FlowerLogix · Tableros de Producción: Rendimiento / Calidad / Resumen Ejecutivo. */
(()=>{"use strict";
const TYPES={
 "siembra-campo":{unit:"esquejes",title:"Esquejes sembrados",qty:r=>valid(r.lineas)&&valid(r.densidad)?Number(r.lineas)*Number(r.densidad):num(r.cantidad??r.totalEsquejes)},
 "desbotonado-mallas":{unit:"tallos",title:"Tallos trabajados",qty:r=>num(r.tallos)},
 "corte":{unit:null,title:"Horas efectivas",qty:()=>null},
 "bandejas-enraizamiento":{unit:"esquejes",title:"Esquejes sembrados",qty:r=>num(r.cantidad??r.totalEsquejes??r.totalEsquejesSembrados)},
 "preparacion-camas":{unit:null,title:"Horas efectivas",qty:()=>null}
};
const WORKERS=[["DEMO-001","Ana Pérez (ejemplo)"],["DEMO-002","Carlos Ruiz (ejemplo)"],
 ["DEMO-003","María López (ejemplo)"],["DEMO-004","Juan Torres (ejemplo)"]];
const nf=new Intl.NumberFormat("es-CO",{maximumFractionDigits:1});
const clean=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=v=>String(v??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();
const valid=v=>v!==null&&v!==undefined&&v!==""&&Number.isFinite(Number(v))&&Number(v)>=0;
const num=v=>valid(v)?Number(v):null;
const date=r=>String(r?.fecha??r?.fechaRegistro??"").slice(0,10);
const workerName=r=>String(r?.sembradorNombre??r?.colaboradorNombre??r?.empleadoNombre??r?.nombreColaborador??
 r?.nombre??r?.sembrador??r?.colaborador??r?.empleado??"Sin identificar");
const workerCode=r=>String(r?.sembrador??r?.colaborador??r?.empleado??workerName(r)).trim();
const pct=(v,n)=>n>0?nf.format(100*v/n)+"%":"—";
const viewDate=d=>/^\d{4}-\d{2}-\d{2}$/.test(d)?d.slice(8,10)+"/"+d.slice(5,7)+"/"+d.slice(0,4):d;
function isoWeek(v){
 const str=typeof v==="object"?date(v):String(v);
 if(!/^\d{4}-\d{2}-\d{2}$/.test(str))return "";
 const d=new Date(str+"T12:00:00Z");if(!Number.isFinite(d.getTime()))return "";
 d.setUTCDate(d.getUTCDate()+3-(d.getUTCDay()+6)%7);
 const y=d.getUTCFullYear(),first=new Date(Date.UTC(y,0,4));
 first.setUTCDate(first.getUTCDate()+3-(first.getUTCDay()+6)%7);
 return y+"-S"+String(1+Math.round((d-first)/604800000)).padStart(2,"0");
}
function sampleLabor(modId){
 let rows=[];
 for(let w=0;w<6;w++)for(let i=0;i<4;i++){
  const [id,name]=WORKERS[i],stamp=new Date(Date.UTC(2026,8,7+w*7+i)).toISOString().slice(0,10);
  const h=5.65+((w+i)%5)*.27;
  const row={fecha:stamp,sembrador:id,sembradorNombre:name,colaborador:id,colaboradorNombre:name,
   bloque:"B"+(i%3+1),cama:"C"+(i+1),horasTrabajadas:Number(h.toFixed(2)),
   tiempoRealMin:Math.round(h*60),__soloDemostracion:true};
  if(modId==="siembra-campo"){row.lineas=5+w+i;row.densidad=[117,130,112,170][i]}
  if(modId==="desbotonado-mallas"){
   row.tallos=960+w*115+i*90;row.mediosCuadros=3+w%3;
   row.tipoLabor=["Desbotón Pompón","Desbotón Spider","Malla","Desbotón Pompón"][i];
  }
  if(modId==="bandejas-enraizamiento"){row.cantidad=950+w*120+i*75}
  if(modId==="corte"){row.rol=["cortador","transportador","recogedor","cortador"][i]}
  rows.push(row);
 }
 return rows;
}
function sampleTimes(modId){
 if(modId!=="bandejas-enraizamiento")return [];
 return sampleLabor(modId).map(row=>({
  fecha:row.fecha,sembrador:row.sembrador,horasExtraMin:30,
  desplazamientoMin:15,calisteniaMin:15,capacitacionMin:15,otrasLaboresMin:70
 }));
}
function sourceQuality(modId){
 const quality=window.QualityReports;
 return quality?.config?.[modId]??{};
}
function sampleQuality(modId){
 const quality=window.QualityReports,groups=sourceQuality(modId);
 return quality?.sampleQualityRecords?.(groups,modId)??[];
}
function effectiveHours(row){
 if(valid(row.horasTrabajadas))return Number(row.horasTrabajadas);
 if(valid(row.horas))return Number(row.horas);
 if(valid(row.tiempoRealMin))return Number(row.tiempoRealMin)/60;
 return null;
}
function bandejasTimeHours(r){
 if(!r)return null;
 const mins=key=>num(r[key])??0;
 const categories=mins("desplazamientoMin")+mins("calisteniaMin")+mins("capacitacionMin");
 // La aplicación de origen incluye estas tres categorías en otrasLaboresMin.
 const aggregated=num(r.otrasLaboresMin);
 const extras=mins("horasExtraMin")+(num(r.horasExtra)??0)*60;
 const other=aggregated!==null?Math.max(0,aggregated-categories):
   mins("pMadresMin")+mins("pAbuelasMin");
 return Math.max(0,(435+extras-categories-other)/60);
}
function enrichedLabor(modId,rows,times){
 if(modId!=="bandejas-enraizamiento")return rows.map(r=>({...r,__horasEfectivas:effectiveHours(r)}));
 const sum=new Map(),byDay=new Map();
 const group=r=>date(r)+"|"+workerCode(r);
 rows.forEach(r=>{const q=TYPES[modId].qty(r);if(q!==null)sum.set(group(r),(sum.get(group(r))??0)+q)});
 times.forEach(r=>{if(date(r)&&workerCode(r))byDay.set(group(r),bandejasTimeHours(r))});
 return rows.map(r=>{
  const hours=byDay.get(group(r)),total=sum.get(group(r)),quantity=TYPES[modId].qty(r);
  return {...r,__horasEfectivas:hours!==undefined&&total>0&&quantity!==null?
    hours*quantity/total:effectiveHours(r)};
 });
}
function filterPeriod(rows,from,to,search){
 return rows.filter(r=>(!from||date(r)>=from)&&(!to||date(r)<=to)&&
  (!search||norm(workerName(r)+" "+workerCode(r)).includes(norm(search))));
}
function filterIndicatorQualityPeriods(rows,years,weeks){
 return rows.filter(r=>{
  const weekKey=isoWeek(r);if(!weekKey)return false;
  return (years===null||years.has(Number(weekKey.slice(0,4))))&&
   (weeks===null||weeks.has(Number(weekKey.slice(-2))));
 });
}
function metric(label,value,sub=""){
 return '<div class="kpi-card"><span>'+clean(label)+'</span><strong>'+clean(value)+'</strong>'+
  (sub?'<small>'+clean(sub)+'</small>':"")+'</div>';
}
function weekly(rows,measure){
 const results=new Map();
 rows.forEach(r=>{const key=isoWeek(r);if(!key)return;
  const value=measure(r);
  if(value===null)return;
  results.set(key,(results.get(key)??0)+value);
 });
 return [...results.entries()].sort(([a],[b])=>a.localeCompare(b)).slice(-8)
   .map(([label,value])=>({label:label.replace(/^20\d{2}-/,""),value}));
}
function graphPanel(title,subtitle,body){
 return '<article class="dash-graph"><div class="dash-graph-heading"><h4>'+clean(title)+'</h4>'+
  (subtitle?'<span>'+clean(subtitle)+'</span>':"")+'</div>'+body+'</article>';
}
const placeholder=message=>'<div class="dash-no-data">'+clean(message)+'</div>';
function lineGraph(data,caption,percent=false){
 if(!data.length||data.every(p=>p.value===null))return placeholder("No hay datos suficientes para graficar.");
 const W=650,H=270,L=48,R=20,T=25,B=48,ww=W-L-R,hh=H-T-B;
 const real=data.filter(d=>Number.isFinite(d.value));
 let ceiling=percent?100:Math.max(...real.map(d=>d.value),1)*1.13;
 ceiling=Math.max(ceiling,percent?100:1);
 const sx=i=>L+(data.length===1?ww/2:i*ww/(data.length-1));
 const sy=v=>T+hh-(v/ceiling)*hh;
 let chunks=[],current=[];
 data.forEach((p,i)=>{if(p.value===null){if(current.length)chunks.push(current);current=[]}else current.push([sx(i),sy(p.value)])});
 if(current.length)chunks.push(current);
 const svg=[];
 for(let tick=0;tick<=4;tick++){
  const val=ceiling*tick/4,y=sy(val);
  svg.push('<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#e3ede7" stroke-dasharray="4 4"/>');
  svg.push('<text x="'+(L-9)+'" y="'+(y+4)+'" text-anchor="end" font-size="12" fill="#64776c">'+clean(percent?Math.round(val)+"%":nf.format(val))+'</text>');
 }
 for(const points of chunks){
  svg.push('<polyline fill="none" stroke="#15704d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" points="'+points.map(p=>p.join(",")).join(" ")+'"/>');
 }
 data.forEach((p,i)=>{
  const x=sx(i);
  svg.push('<text x="'+x+'" y="'+(H-16)+'" text-anchor="middle" font-size="12" fill="#64776c">'+clean(p.label)+'</text>');
  if(p.value!==null){
   const y=sy(p.value);
   svg.push('<circle cx="'+x+'" cy="'+y+'" r="5" fill="#15704d"><title>'+clean(p.label+" · "+nf.format(p.value)+(percent?"%":""))+'</title></circle>');
  }
 });
 return '<svg class="dash-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+clean(caption)+'">'+svg.join("")+'</svg>';
}
function barGraph(data,caption,unit="",maxRows=6){
 const rows=data.filter(r=>Number.isFinite(r.value)).sort((a,b)=>b.value-a.value).slice(0,maxRows);
 if(!rows.length)return placeholder("Aún no hay datos comparables.");
 const W=650,L=180,R=65,barH=36,H=rows.length*barH+24,avail=W-L-R,highest=Math.max(...rows.map(x=>x.value),1);
 const parts=[];
 rows.forEach((r,i)=>{
  const y=i*barH+14,w=avail*Math.max(0,r.value)/highest;
  const label=String(r.label),shown=label.length>25?label.slice(0,24)+"…":label;
  parts.push('<text x="'+(L-12)+'" y="'+(y+17)+'" font-size="12" text-anchor="end" fill="#345342">'+clean(shown)+'</text>'+
   '<rect x="'+L+'" y="'+y+'" width="'+avail+'" height="22" rx="5" fill="#eff5f1"/>'+
   '<rect x="'+L+'" y="'+y+'" width="'+w+'" height="22" rx="5" fill="#238457"><title>'+
    clean(label+" · "+nf.format(r.value)+" "+unit)+'</title></rect>'+
   '<text x="'+(L+Math.min(w+7,avail+8))+'" y="'+(y+16)+'" font-size="11" fill="#314a3d">'+clean(nf.format(r.value))+'</text>');
 });
 return '<svg class="dash-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+clean(caption)+'">'+parts.join("")+'</svg>';
}
function personRanking(rows,measure){
 const map=new Map();
 rows.forEach(r=>{const v=measure(r);if(v===null)return;
  const id=workerCode(r),p=map.get(id)??{label:workerName(r),value:0};
  p.value+=v;map.set(id,p)});
 return [...map.values()];
}
function qualityRole(r,groups){
 const role=norm(r.__calidadGrupo??r.vistaCalidad??r.vista??r.rol??r.subtipo??r.tipoRol);
 if(groups[role])return role;
 if(groups["cortador-pompon"]&&(r.modalidad!=null||role==="cortador")){
  if(Number(r.modalidad)===2)return "cortador-spider";
  if(Number(r.modalidad)===1)return "cortador-pompon";
 }
 if(groups.spider&&/spider|cremon/.test(role))return "spider";
 if(groups.pompon&&role.includes("pompon"))return "pompon";
 const keys=Object.keys(groups);return keys.length===1?keys[0]:"";
}
function qualityCatalog(modId,groupId){
 const groups=sourceQuality(modId),group=groups[groupId];if(!group)return [];
 let stored=[];
 if(group.external){
  try{stored=JSON.parse(localStorage.getItem("flowerlogix_jn_data_produccion_"+modId+
   "_quality_catalog_"+groupId)||"[]")}catch{}
 }
 const list=Array.isArray(stored)&&stored.length?stored:group.items;
 return (list||[]).filter(i=>Array.isArray(i)&&i.length>=2)
  .map(i=>[String(i[0]),String(i[1])]).filter(([id,name])=>
    !group.conformIds?.includes(id)&&!/^(ramo\s+)?conforme$/.test(norm(name)));
}
function failuresOf(r,group,items){
 if(r.esMuestraReal===false||r.noRealizarMuestra===true)return null;
 const state=norm(r.estadoMuestra??r.resolucion??"");
 if(/no.?realizar.?muestra|no.?evaluada|sin.?muestra/.test(state))return null;
 const raw=Array.isArray(r.fallosDetalle)?r.fallosDetalle:
  Array.isArray(r.incumplimientos)?r.incumplimientos:
  Array.isArray(r.items)?r.items:Array.isArray(r.itemsNombres)?r.itemsNombres:
  Array.isArray(r.failures)?r.failures:null;
 if(!raw&&!r.conformeSeleccionado)return null;
 if(items.length===0)return null;
 const ids=new Map(items.map(([id])=>[id,id])),names=new Map(items.map(([id,name])=>[norm(name),id]));
 const failed=new Set();let unknown=false;
 for(const value of raw??[]){
  if(value&&typeof value==="object"&&valid(value.cantidad)&&Number(value.cantidad)===0)continue;
  const item=value&&typeof value==="object"?(value.idItemDocumento??value.idItem??value.itemId??value.id??value.item??value.nombre??value.name):value;
  const key=String(item??"").trim();
  if(!key||group.conformIds?.includes(key)||/^(ramo\s+)?conforme$/.test(norm(key)))continue;
  const id=ids.get(key)??names.get(norm(key));
  if(id!==undefined)failed.add(id);else unknown=true;
 }
 return unknown?null:failed;
}
function qualityRows(modId,rows,groupId,from,to,search){
 const groups=sourceQuality(modId),group=groups[groupId],items=qualityCatalog(modId,groupId);
 if(!group)return {items,rows:[],excluded:0};
 const matching=filterPeriod(rows,from,to,search).filter(r=>qualityRole(r,groups)===groupId);
 let excluded=0;
 const mapped=[];
 matching.forEach(r=>{const f=failuresOf(r,group,items);if(f===null){excluded++;return}mapped.push({...r,__failures:f})});
 return {items,rows:mapped,excluded};
}
function qualityData(rows,items){
 const total=rows.length,ok=rows.filter(r=>r.__failures.size===0).length;
 const defects=items.map(([id,label])=>({label,value:rows.filter(r=>r.__failures.has(id)).length}))
  .filter(d=>d.value>0).sort((a,b)=>b.value-a.value);
 const weeks=new Map(),persons=new Map();
 rows.forEach(r=>{
  const k=isoWeek(r);if(k){const item=weeks.get(k)??{label:k.replace(/^20\d{2}-/,""),n:0,ok:0};
   item.n++;if(!r.__failures.size)item.ok++;weeks.set(k,item)}
  const id=workerCode(r),p=persons.get(id)??{label:workerName(r),n:0,ok:0};
  p.n++;if(!r.__failures.size)p.ok++;persons.set(id,p);
 });
 return {total,ok,rate:total?100*ok/total:null,defects,
  weeks:[...weeks.entries()].sort(([a],[b])=>a.localeCompare(b)).slice(-8).map(([,v])=>({label:v.label,value:100*v.ok/v.n})),
  people:[...persons.values()].filter(v=>v.n>0).map(v=>({label:v.label,value:100*v.ok/v.n,n:v.n}))};
}
function sampleAlert(text){return '<div class="dash-sample"><strong>DATOS DE PRUEBA</strong> '+clean(text)+'</div>'}
function sharedNotice(demo,missing){
 return demo?sampleAlert("Cifras y gráficos ilustrativos; no se guardan ni se mezclan con registros reales."):
  '<div class="module-notice">Datos reales importados localmente; sin sincronización automática con Producción.'+
  (missing?' '+clean(missing):"")+'</div>';
}
function laborStats(modId,rows){
 const type=TYPES[modId],qty=rows.map(r=>type.qty(r)).filter(v=>v!==null),
  good=rows.filter(r=>type.qty(r)!==null&&r.__horasEfectivas!==null&&r.__horasEfectivas>0);
 const total=qty.reduce((s,v)=>s+v,0);
 const hours=rows.map(r=>r.__horasEfectivas).filter(v=>v!==null&&v>=0).reduce((s,v)=>s+v,0);
 const known=rows.filter(r=>r.__horasEfectivas!==null);
 const pairedHours=good.reduce((s,r)=>s+r.__horasEfectivas,0);
 const pairedQty=good.reduce((s,r)=>s+type.qty(r),0);
 return {type,total,qtyCount:qty.length,hours,hoursCount:known.length,
  workerCount:new Set(rows.map(workerCode)).size,days:new Set(rows.map(date).filter(Boolean)).size,
  rate:pairedHours>0?pairedQty/pairedHours:null};
}
function chartsLabor(modId,rows){
 const stats=laborStats(modId,rows),qtyMode=stats.type.unit!==null&&stats.qtyCount>0,
   measure=qtyMode?r=>stats.type.qty(r):r=>r.__horasEfectivas;
 const mainTitle=qtyMode?stats.type.title:"Horas efectivas";
 return '<div class="dash-graphs">'+
  graphPanel("Evolución semanal",mainTitle+" por semana",
    lineGraph(weekly(rows,measure),"Evolución semanal de "+mainTitle.toLowerCase()))+
  graphPanel("Colaboradores",mainTitle+" por colaborador",
    barGraph(personRanking(rows,measure),"Comparación de colaboradores",qtyMode?stats.type.unit:"horas"))+
  graphPanel("Distribución de la labor","Por bloque o rol",
    barGraph((()=>{
      const groups=new Map();
      rows.forEach(r=>{
        const k=modId==="corte"?String(r.rolNombre??r.rol??"Sin rol"):
          String(r.bloque??"Sin bloque");
        const v=measure(r);if(v===null)return;
        groups.set(k,(groups.get(k)??0)+v);
      });
      return [...groups].map(([label,value])=>({label,value}));
    })(),"Desglose de actividad",qtyMode?stats.type.unit:"horas"))+
  '</div>';
}
function sectionRend(modId,rows){
 const s=laborStats(modId,rows),unit=s.type.unit;
 return '<div class="dash-kpis">'+
  metric("Registros de labor",nf.format(rows.length))+
  metric(unit?s.type.title:"Horas efectivas",unit?(s.qtyCount?nf.format(s.total):"—"):
   (s.hoursCount?nf.format(s.hours)+" h":"—"))+
  metric(unit?"Rendimiento ("+unit+"/hora)":"Colaboradores",unit?
   (s.rate!==null?nf.format(s.rate):"—"):nf.format(s.workerCount),
   unit&&s.rate===null?"Requiere producción y horas comparables":"")+
  metric("Horas efectivas",s.hoursCount?nf.format(s.hours)+" h":"—",
   s.hoursCount?nf.format(s.hoursCount)+" registros con horas":"Sin tiempos asociados")+'</div>'+
  chartsLabor(modId,rows);
}
function sectionQuality(modId,rows,role,from,to,search){
 const q=qualityRows(modId,rows,role,from,to,search),s=qualityData(q.rows,q.items);
 return '<div class="dash-kpis">'+metric("Muestras evaluadas",nf.format(s.total))+
  metric("Conformidad general",s.rate===null?"—":nf.format(s.rate)+"%")+
  metric("Evaluaciones conformes",nf.format(s.ok))+
  metric("Criterios con fallas",nf.format(s.defects.length))+'</div>'+
  '<div class="dash-graphs">'+
  graphPanel("Conformidad por semana","Porcentaje de muestras conformes",lineGraph(s.weeks,"Conformidad semanal",true))+
  graphPanel("Principales incumplimientos","Número de evaluaciones con falla",barGraph(s.defects,"Principales criterios con incumplimientos","evaluaciones"))+
  graphPanel("Conformidad por colaborador","Porcentaje de muestras conformes",barGraph(s.people,"Comparación de calidad por colaborador","%",6))+
  '</div>'+
  (q.excluded?'<div class="module-notice">'+nf.format(q.excluded)+
   ' evaluaciones no se pudieron clasificar o no se realizaron; se excluyen de los porcentajes.</div>':"")+
  (!q.items.length?'<div class="module-notice">No hay criterios reales disponibles para esta modalidad. No se generan resultados de calidad ficticios.</div>':"");
}
function summarySection(modId,labor,quality,role,from,to,search){
 const s=laborStats(modId,labor),q=qualityRows(modId,quality,role,from,to,search),

function netHours(r){

 const actualHours=uniqueHours.size?[...uniqueHours.values()].filter(v=>v!==null).reduce((a,b)=>a+b,0):
   labor.reduce((s,r)=>s+(r.__rendHours??0),0);
 const known=uniqueHours.size?[...uniqueHours.values()].some(v=>v!==null):
   labor.some(r=>r.__rendHours!==null);
 return {records:labor.length,people:new Set(labor.map(code).filter(Boolean)).size,
   qty:qty.length?totalQty:null,rate:pairedHours>0?pairedQty/pairedHours:null,
   hours:known?actualHours:null};
}
function htmlTable(headers,rows,empty){

function displayLabor(mod,rows){
 if(mod==="desbotonado-mallas"){
  const headers=["Nombre de la persona","Bloque","Cama","Medios cuadrados hechos",
   "Tallos por cama","Tallos realizados","Rendimiento por hora"];
  return {headers,rows:rows.map(r=>[
   person(r),r.bloque??"—",r.cama??"—",
   num(r.mediosCuadros??r.mediosCuadrados??r.mediosCuadrosHechos)===null?"—":
    fmt.format(num(r.mediosCuadros??r.mediosCuadrados??r.mediosCuadrosHechos)),
   num(r.tallosCama??r.tallosPorCama)===null?"—":
    fmt.format(num(r.tallosCama??r.tallosPorCama)),
   r.__rendQty===null?"—":fmt.format(r.__rendQty),
   r.__rendRate===null?"—":fmt.format(r.__rendRate)
  ])};
 }
 if(mod==="bandejas-enraizamiento"){
  const h=["Fecha","Nombre del sembrador","Bloque","Cama","Total esquejes sembrados","Horas trabajadas","Promedio esquejes/hora"];
  const sums=new Map();
  rows.forEach(r=>{
   const k=JSON.stringify([day(r),code(r),r.bloque??"",r.cama??""]);
   if(!sums.has(k))sums.set(k,{fecha:day(r),name:person(r),bloque:r.bloque??"",cama:r.cama??"",qty:0,known:false,hours:0});
   const item=sums.get(k);item.qty+=r.__rendQty??0;
   if(r.__rendHours!==null){item.known=true;item.hours+=r.__rendHours;}
  });
  return {headers:h,rows:[...sums.values()].sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(r=>
   [r.fecha,r.name,r.bloque,r.cama,fmt.format(r.qty),r.known?fmt.format(r.hours):"—",r.hours>0?fmt.format(r.qty/r.hours):"—"])};
 }
 const rawKeys=[...new Set(rows.flatMap(r=>Object.keys(r).filter(k=>!k.startsWith("__"))))].slice(0,28);
 const order=["fecha","sembradorNombre","colaboradorNombre","empleadoNombre","bloque","cama"];
 const keys=[...rawKeys].sort((a,b)=>{
  const i=order.indexOf(a),j=order.indexOf(b);
  return i>=0&&j>=0?i-j:i>=0?-1:j>=0?1:0;
 });
 const config=MODS[mod];
 const h=[...keys,...(config.unit?["Horas efectivas","Rendimiento ("+config.unit+"/h)"]:[])];
 const raw=rows.map(r=>[...keys.map(k=>{
  const v=r[k];return v!==null&&typeof v==="object"?JSON.stringify(v):v??"";
 }),...(config.unit?[r.__rendHours===null?"—":fmt.format(r.__rendHours),r.__rendRate===null?"—":fmt.format(r.__rendRate)]:[])]);
 return {headers:h.length?h:["Fecha","Colaborador"],rows:raw};
}
function displayTimes(rows,names=new Map()){
 // Vista exclusivamente de consulta: los importes de otra aplicación se
 // almacenan en minutos. "otrasLaboresMin" es un agregado que puede contener
 // las categorías detalladas; restarlas otra vez duplicaría descuentos.
 const headers=[
  "Fecha","Código","Nombre de la persona","Horas laborales (h)","Horas extra (h)",
  "Desplazamiento (h)","Calistenia (h)","Capacitación (h)",
  "Plantas madres (h)","Plantas abuelas (h)","Pausas (h)",
  "Cambio de labor (h)","Incapacidad (h)","Vacaciones (h)",
  "Examen médico (h)","Otras labores (h)","Tiempo disponible (h)",
  "Total descuentos (h)","Tiempo real de la labor (h)"
 ];
 const mins=(r,key)=>num(r[key])??0;
 const hours=v=>v===null||v===undefined?"—":fmt.format(v/60);
 const keys=["desplazamientoMin","calisteniaMin","capacitacionMin",
  "pMadresMin","pAbuelasMin","pausasMin","cambioLaborMin",
  "incapacidadMin","vacacionesMin","examenMedicoMin"];
 const data=rows.map(r=>{
  const base=num(r.horasLaboralesMin);
  const extra=num(r.horasExtraMin)??(num(r.horasExtra)!==null?num(r.horasExtra)*60:0);
  const components=keys.reduce((total,key)=>total+mins(r,key),0);
  const aggregate=num(r.otrasLaboresMin);
  const exclusive=aggregate===null?0:Math.max(0,aggregate-components);
  const deducted=components+exclusive;
  const available=num(r.tiempoDisponibleMin)??(base!==null?base+extra:null);
  const effective=num(r.tiempoRealMin)!==null?num(r.tiempoRealMin):
   (netHours(r)!==null?netHours(r)*60:null);
  return [
   day(r),code(r),names.get(dayPerson(r))||person(r),
   hours(base),hours(extra),...keys.map(key=>hours(mins(r,key))),
   hours(exclusive),hours(available),hours(deducted),hours(effective)
  ];
 });
 return {headers,rows:data};
}

 const $=id=>panel.querySelector("#"+id),worker=$("pWorker"),year=$("pYear"),week=$("pWeek"),date=$("pDay");

 const activeTimes=()=>demo?example.times:times;
 // Los tiempos históricos pueden venir asociados a una modalidad

 const taggedTime=r=>String(r.__laborGrupo??r.tipoLabor??r.tipoRol??"").trim()!=="";
 const belongsTimeToVariant=r=>!selectedVariant||matches(r);
 const asLabel=(value,label)=>'<div class="module-stat"><span>'+esc(label)+'</span><strong>'+esc(value)+'</strong></div>';
 const refresh=()=>{
  const baseLabor=activeLabor(),baseTimes=activeTimes();
  // Only time records belonging to workers and days of THIS labor.

  // El registro de tiempos de Desbotonado es por persona/día, no por

   });
  }

   // Los tiempos nuevos identifican explícitamente a qué labor pertenecen.
   if(taggedTime(r))return belongsTimeToVariant(r);
   // Los tiempos antiguos compartidos solo se atribuyen a una modalidad
   // cuando fue la única labor de esa persona ese día.
   if(!selectedVariant)return true;
   if(!dayKeys.has(dayPerson(r)))return false;
   return mod.id!=="desbotonado-mallas"||
     (laborTypesByDay.get(dayPerson(r))?.size??0)<=1;
  });
  const available=[...new Set([...baseLabor.map(day),...tiedTimes.map(day)]
     .filter(v=>/^\d{4}-\d{2}-\d{2}$/.test(v)))].sort();
  const isoWeeks=[...new Set(available.map(weekKey).filter(Boolean))].sort();

    yearWeeks.map(v=>'<option value="'+v+'">Semana '+v.slice(-2)+
      (!selectedYear?' · '+v.slice(0,4):"")+'</option>').join("");
  week.value=selectedWeek;
  const weekDays=selectedWeek?weekDates(selectedWeek):[];
  if(!weekDays.includes(selectedDay))selectedDay="";
  const dayNames=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
  date.innerHTML='<option value="">Todos los días</option>'+
    weekDays.map((d,i)=>'<option value="'+d+'">'+dayNames[i]+' '+d.slice(8,10)+'/'+d.slice(5,7)+'</option>').join("");
  date.value=selectedDay;
  date.disabled=!selectedWeek;

  worker.disabled=personMode==="grupal";worker.placeholder=personMode==="grupal"?

  $("pWorkers").innerHTML=[...new Map([...baseLabor,...tiedTimes].map(r=>[code(r),person(r)]))].map(([id,name])=>

  const inPeriod=r=>{
   const d=day(r),iso=weekKey(d);
   if(selectedWeek)return iso===selectedWeek&&(!selectedDay||d===selectedDay);

    function downloadCSV(rows,columns,fileName) {
      const quote = cell => {
        const value=typeof cell==="object" && cell!==null ? JSON.stringify(cell) : String(cell ?? "");
        const guarded=/^[=+\-@]/.test(value) ? "'"+value : value;
        return '"' + guarded.replaceAll('"','""') + '"';
      };
      const csv="\uFEFF"+[columns.map(quote).join(";"),
        ...rows.map(r=>columns.map(col=>quote(r[col])).join(";"))].join("\r\n");
      const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
      const a=document.createElement("a");
      a.href=url;a.download=fileName+".csv";a.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    }


    // Tabla particular de rendimiento para Bandejas Enraizamiento.
    // Producción registra esquejes por cama y tiempo real por sembrador/fecha.
    function renderBandejasRendimiento(areaId,mod,panel) {
      const fields=["Fecha","Nombre del sembrador","Bloque","Cama","Total esquejes sembrados","Horas trabajadas","Promedio de esquejes por hora"];
      const exampleLabor=[
        {fecha:"2026-10-08",sembrador:"DEMO01",sembradorNombre:"Sembrador de prueba 1",bloque:"B1",cama:"C1",cantidad:1200},
        {fecha:"2026-10-08",sembrador:"DEMO01",sembradorNombre:"Sembrador de prueba 1",bloque:"B1",cama:"C2",cantidad:600},
        {fecha:"2026-10-08",sembrador:"DEMO02",sembradorNombre:"Sembrador de prueba 2",bloque:"B2",cama:"C3",cantidad:1000},
        {fecha:"2026-10-07",sembrador:"DEMO03",sembradorNombre:"Sembrador de prueba 3",bloque:"B3",cama:"C1",cantidad:850}
      ];
      const exampleTimes=[
        {fecha:"2026-10-08",sembrador:"DEMO01",horasExtraMin:30,desplazamientoMin:15,calisteniaMin:15,capacitacionMin:15,otrasLaboresMin:60},
        {fecha:"2026-10-08",sembrador:"DEMO02",horasExtraMin:15,desplazamientoMin:15,calisteniaMin:15,capacitacionMin:15,otrasLaboresMin:45},
        {fecha:"2026-10-07",sembrador:"DEMO03",horasExtraMin:0,desplazamientoMin:15,calisteniaMin:15,capacitacionMin:15,otrasLaboresMin:60}
      ];
      const laborKey=dataKey(areaId,mod.id),timeKey=dataKey(areaId,mod.id+"_tiempos");
      let labor=getRecords(areaId,mod.id),times=getRecords(areaId,mod.id+"_tiempos");
      let demo=labor.length===0;
      const date=r=>String(r.fecha??"").slice(0,10);
      const workerId=r=>String(r.sembrador??r.colaborador??r.codigo??r.sembradorNombre??r.colaboradorNombre??"").trim().toLowerCase();
      const workerName=r=>String(r.sembradorNombre??r.colaboradorNombre??r.nombre??r.sembrador??"Sin nombre");
      const numeric=v=>v!==null&&v!==undefined&&v!==""&&Number.isFinite(Number(v))&&Number(v)>=0;
      const qty=r=>Number(r.cantidad??r.totalEsquejes??r.totalEsquejesSembrados);
      const dayKey=r=>JSON.stringify([date(r),workerId(r)]);
      function calculate(labors,timeRows) {
        const good=labors.filter(r=>r&&date(r)&&workerId(r)&&String(r.bloque??"").trim()&&
          String(r.cama??"").trim()&&Number.isFinite(qty(r))&&qty(r)>0);
        const totals=new Map();
        good.forEach(r=>totals.set(dayKey(r),(totals.get(dayKey(r))||0)+qty(r)));
        // Jornada base: 7,25 h = 435 minutos, una sola vez por sembrador/fecha.
        // Producción guarda "otrasLaboresMin" como suma de desplazamiento,
        // calistenia, capacitación, PMadres y PAbuelas. Se descontará esa suma
        // una única vez; no se deben duplicar sus componentes.
        const BASE_MIN=435;
        const minutes=(r,field)=>numeric(r[field])?Number(r[field]):0;
        const workedMinutes=r=>{
          const extra=minutes(r,"horasExtraMin")||
            (numeric(r.horasExtra)?Number(r.horasExtra)*60:0);
          const desplazamiento=minutes(r,"desplazamientoMin");
          const calistenia=minutes(r,"calisteniaMin");
          const capacitacion=minutes(r,"capacitacionMin");
          const categorias=desplazamiento+calistenia+capacitacion;
          const otrasAgregadas=numeric(r.otrasLaboresMin)
            ? Number(r.otrasLaboresMin)
            : categorias+minutes(r,"pMadresMin")+minutes(r,"pAbuelasMin");
          // Las "otras labores" se calculan sin volver a contar las tres categorías.
          const otrasExclusivas=Math.max(0,otrasAgregadas-categorias);
          return Math.max(0,BASE_MIN+extra-desplazamiento-calistenia-capacitacion-otrasExclusivas);
        };
        const hoursByDay=new Map();
        timeRows.forEach(r=>{
          if(!r||!date(r)||!workerId(r))return;
          // Puede haber una corrección del registro: se utiliza la última
          // entrada del día para no sumar otra jornada base de 7,25 horas.
          hoursByDay.set(dayKey(r),workedMinutes(r)/60);
        });
        const groups=new Map();
        good.forEach(r=>{
          const k=JSON.stringify([date(r),workerId(r),String(r.bloque),String(r.cama)]);
          if(!groups.has(k))groups.set(k,{fecha:date(r),sembrador:workerName(r),bloque:String(r.bloque),
            cama:String(r.cama),esquejes:0,horas:0,conHoras:false});
          const item=groups.get(k),dk=dayKey(r);
          item.esquejes+=qty(r);
          if(hoursByDay.has(dk)&&totals.get(dk)>0){
            item.horas+=hoursByDay.get(dk)*qty(r)/totals.get(dk);
            item.conHoras=true;
          }
        });
        return [...groups.values()].map(r=>({
          ...r,horas:r.conHoras?r.horas:null,
          promedio:r.conHoras&&r.horas>0?r.esquejes/r.horas:null
        })).sort((a,b)=>b.fecha.localeCompare(a.fecha)||a.sembrador.localeCompare(b.sembrador,"es")||
          a.bloque.localeCompare(b.bloque,"es")||a.cama.localeCompare(b.cama,"es"));
      }
      panel.innerHTML='<div class="page-kicker">RENDIMIENTO / BANDEJAS ENRAIZAMIENTO</div>'+
        '<h3 class="quality-heading">Rendimiento por sembrador y cama</h3>'+
        '<div class="module-filters">'+
        '<label>Desde<input id="eDesde" type="date"></label>'+
        '<label>Hasta<input id="eHasta" type="date"></label>'+
        '<label>Sembrador<input id="eSembrador" type="search" placeholder="Nombre del sembrador"></label>'+
        '<label class="btn-primary quality-upload">Importar esquejes JSON<input id="eEsquejesArchivo" type="file" accept=".json,application/json" hidden></label>'+
        '<label class="btn-primary quality-upload">Importar tiempos JSON<input id="eTiemposArchivo" type="file" accept=".json,application/json" hidden></label>'+
        '<button class="btn-secondary" type="button" id="eCSV">Exportar CSV</button>'+
        '<button class="btn-secondary" type="button" id="eLimpiar">Limpiar filtros</button>'+
        '<button class="btn-secondary" type="button" id="eDemo">Ver datos reales</button></div>'+
        '<div id="eDemoAviso" class="quality-demo-banner" role="status"></div>'+
        '<div id="eAviso" class="module-notice">Las horas reales se registran por sembrador y fecha. '+
        'Fórmula: tiempo de labor = 7,25 horas + horas extra − desplazamiento − calistenia − capacitación − otras labores. '+
        'En Producción, otrasLaboresMin ya incluye desplazamiento, calistenia y capacitación; se descuentan una sola vez. '+
        'Si hay varias camas en un día, el tiempo se distribuye proporcionalmente a los esquejes. '+
        'Promedio = esquejes sembrados ÷ horas de labor. Sin registro de tiempos, se muestra —.</div>'+
        '<div class="module-summary analysis-metrics">'+
        '<div class="module-stat"><span>Total esquejes sembrados</span><strong id="eTotal">0</strong></div>'+
        '<div class="module-stat"><span>Horas trabajadas</span><strong id="eHoras">—</strong></div>'+
        '<div class="module-stat"><span>Promedio esquejes/hora</span><strong id="ePromedio">—</strong></div>'+
        '<div class="module-stat"><span>Sembradores</span><strong id="ePersonas">0</strong></div></div>'+
        '<div class="module-tablewrap"><table class="module-table" style="min-width:950px"><thead><tr>'+
        fields.map(f=>'<th>'+esc(f)+'</th>').join("")+'</tr></thead><tbody id="eFilas"></tbody></table></div>';
      const get=id=>panel.querySelector("#"+id);
      const desde=get("eDesde"),hasta=get("eHasta"),buscar=get("eSembrador");
      let visible=[];
      const format=n=>n===null?"—":fmt.format(n);
      function refresh(){
        visible=calculate(demo?exampleLabor:labor,demo?exampleTimes:times).filter(r=>
          (!desde.value||r.fecha>=desde.value)&&(!hasta.value||r.fecha<=hasta.value)&&
          (!buscar.value||r.sembrador.toLowerCase().includes(buscar.value.toLowerCase()))
        );
        const total=visible.reduce((v,r)=>v+r.esquejes,0);
        const hours=visible.reduce((v,r)=>v+(r.horas??0),0);
        const known=visible.filter(r=>r.horas!==null);
        get("eTotal").textContent=fmt.format(total);
        get("eHoras").textContent=known.length?fmt.format(hours):"—";
        get("ePromedio").textContent=hours>0?fmt.format(known.reduce((v,r)=>v+r.esquejes,0)/hours):"—";
        get("ePersonas").textContent=fmt.format(new Set(visible.map(r=>r.sembrador)).size);
        get("eFilas").innerHTML=visible.length?visible.map(r=>
          '<tr><td>'+esc(r.fecha)+'</td><td>'+esc(r.sembrador)+'</td><td>'+esc(r.bloque)+'</td>'+
          '<td>'+esc(r.cama)+'</td><td>'+fmt.format(r.esquejes)+'</td><td>'+format(r.horas)+
          '</td><td>'+format(r.promedio)+'</td></tr>').join(""):
          '<tr><td class="module-empty" colspan="7">Sin registros para esta selección.</td></tr>';
        get("eDemoAviso").hidden=!demo;
        get("eDemoAviso").innerHTML=demo?'<strong>DATOS DE PRUEBA — EJEMPLO</strong>'+
          '<span>Sembradores, fechas, cantidades, horas y promedios ficticios. No se guardan como datos reales.</span>':"";
        get("eDemo").textContent=demo?"Ver datos reales":"Ver datos de prueba";
      }
      [desde,hasta,buscar].forEach(node=>node.addEventListener("input",refresh));
      get("eLimpiar").addEventListener("click",()=>{desde.value="";hasta.value="";buscar.value="";refresh()});
      get("eDemo").addEventListener("click",()=>{demo=!demo;refresh()});
      async function load(event,mode){
        const file=event.target.files[0];if(!file)return;
        try{
          if(file.size>5*1024*1024)throw Error("Archivo mayor de 5 MB.");
          const content=JSON.parse(await file.text());
          const candidates=mode==="labor"?["labor","bandejasEnraizamiento","registros"]:["tiempos","bandejasTiempos","registros"];
          const rows=Array.isArray(content)?content:candidates.map(x=>content?.[x]).find(Array.isArray);
          if(!Array.isArray(rows)||rows.length>20000||!rows.every(r=>r&&typeof r==="object"&&!Array.isArray(r)))
            throw Error("Se requiere una lista JSON válida, máximo 20.000 registros.");
          if(rows.some(r=>!date(r)||!workerId(r)||!(mode==="labor"?
            String(r.bloque??"").trim()&&String(r.cama??"").trim()&&numeric(r.cantidad??r.totalEsquejes??r.totalEsquejesSembrados):
            ["horasExtraMin","horasExtra","desplazamientoMin","calisteniaMin","capacitacionMin",
             "otrasLaboresMin","pMadresMin","pAbuelasMin","horasLaboralesMin","tiempoRealMin"]
              .some(field=>numeric(r[field])))))
            throw Error("Faltan campos requeridos de "+(mode==="labor"?"esquejes":"tiempos")+".");
          localStorage.setItem(mode==="labor"?laborKey:timeKey,JSON.stringify(rows));
          if(mode==="labor")labor=rows;else times=rows;
          demo=false;
          get("eAviso").textContent="Se importaron "+rows.length+" registros de "+(mode==="labor"?"esquejes":"tiempos")+
            " en este navegador. No existe todavía conexión automática con Producción.";
          refresh();
        }catch(e){get("eAviso").textContent="No se pudo importar: "+e.message;}
        finally{event.target.value="";}
      }
      get("eEsquejesArchivo").addEventListener("change",e=>load(e,"labor"));
      get("eTiemposArchivo").addEventListener("change",e=>load(e,"time"));
      get("eCSV").addEventListener("click",()=>{
        if(!visible.length)return;
        const rows=visible.map(r=>Object.fromEntries(fields.map((label,i)=>[label,
          [r.fecha,r.sembrador,r.bloque,r.cama,r.esquejes,
           r.horas===null?"":Number(r.horas.toFixed(4)),
           r.promedio===null?"":Number(r.promedio.toFixed(2))][i]])));
        downloadCSV(rows,fields,"enraizamiento-rendimiento"+(demo?"-DEMO":""));
      });
      refresh();
    }

          if(!record||record.esMuestraReal===false||record.noRealizarMuestra===true)return null;
          const estado=String(record.estadoMuestra||record.resolucion||"").toLowerCase();

              Number(item?.cantidad??item?.total??1)>0);
            return !anyFailure;

            Array.isArray(record.items)?record.items:null;

            const conformeCorte=mod.id==="corte";

              const id=typeof item==="object"&&item!==null?(item.idItem??item.id??item.nombre):item;
              const str=String(id??"").trim().toLowerCase();
              return str!==""&&str!=="-infinity"&&str!=="conforme"&&str!=="ramo conforme"&&
                !(conformeCorte&&str==="1");

            return failures.length===0;
