<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>FlowerLogix · Analítica Sede JN</title>
<link rel="stylesheet" href="./styles.css">
<style>
.topbar{min-height:135px}
.menu-btn{display:block;text-decoration:none}
.area-buttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}
.area-action{border:1px solid var(--border);border-radius:14px;background:#fbfdfc;padding:22px 15px;text-align:left;cursor:pointer;color:var(--text)}
.area-action:hover{border-color:var(--green)}
.area-action strong{font-size:.95rem}
@media(max-width:780px){.area-buttons{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app-shell">
<aside class="sidebar">
 <div class="brand"><div class="brand-logo">FL</div><div><strong>FlowerLogix</strong><span>Analítica · Sede JN</span></div></div>
 <div class="sidebar-section">MÓDULOS</div>
 <nav id="sidebarMenu" aria-label="Módulos"></nav>
</aside>
<section class="workspace">
 <header class="topbar"><div><div class="eyebrow">FLOWERLOGIX / SEDE JN</div><h1 id="heading">Analítica</h1><p id="subtitle">Consulta y análisis de información.</p></div></header>
 <main id="app" class="main-card"></main>
</section>
</div>
<script>
"use strict";
const areas=[
 {id:"poscosecha",label:"Poscosecha"},
 {id:"mipe",label:"MIPE"},
 {id:"mirfe",label:"MIRFE"}
];
const nav=document.getElementById("sidebarMenu");
const app=document.getElementById("app");
const heading=document.getElementById("heading");
function render(){
 const selected=new URLSearchParams(location.search).get("area");
 const area=areas.find(item=>item.id===selected);
 nav.innerHTML=areas.map(item=>'<a class="menu-btn'+(selected===item.id?' active':'')+'" href="?area='+item.id+'"'+(selected===item.id?' aria-current="page"':'')+'>'+item.label+'</a>').join("");
 if(!area){
  heading.textContent="Analítica · Sede JN";
  document.getElementById("subtitle").textContent="Seleccione un área del menú para consultar sus reportes.";
  app.innerHTML='<div class="page-kicker">ÁREAS DISPONIBLES</div><h2 class="page-title">Seleccione un módulo</h2><div class="area-buttons">'+areas.map(item=>'<a class="area-action" href="?area='+item.id+'"><strong>'+item.label+'</strong></a>').join("")+'</div>';
 }else{
  heading.textContent=area.label;
  document.getElementById("subtitle").textContent="Consulta y análisis de información.";
  app.innerHTML='<div class="page-kicker">MÓDULO</div><h2 class="page-title">'+area.label+'</h2><p class="page-description">Esta sección está lista para configurar los reportes correspondientes. Todavía no hay conexión automática con el sistema de origen.</p>';
 }
 document.title=(area?area.label:"Analítica")+" · FlowerLogix";
}
render();
</script>
</body></html>
