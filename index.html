<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlowerLogix · Analítica Sede JN</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    .topbar { min-height: 135px; }
    .home-section { margin-top:24px; padding-top:15px; border-top:1px solid var(--border); }
    .home-section-heading { display:flex; justify-content:space-between; gap:12px; align-items:center; }
    .home-section-heading h3 { margin:0; font-size:1.08rem; }
    .home-area-link { color:var(--green); font-weight:700; font-size:.74rem; text-decoration:none; }
    .menu-btn { display:block; text-decoration:none; }
    .module-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(225px,1fr)); gap:14px; margin-top:20px; }
    .module-link { display:flex; align-items:center; justify-content:space-between; gap:12px; border:1px solid var(--border);
      border-radius:15px; background:#fbfdfc; padding:20px 16px; color:var(--text); text-decoration:none; min-height:94px; }
    .module-link:hover,.module-link:focus-visible { border-color:var(--green); background:var(--green-soft); outline-offset:2px; }
    .module-link strong { font-size:.86rem; }
    .module-link small { display:block; color:var(--muted); font-size:.65rem; margin-bottom:7px; }
    .module-icon { display:grid; place-items:center; min-width:36px; height:36px; border-radius:11px; background:var(--green-soft); font-size:1.15rem; }
    .operation-tabs { display:flex; gap:10px; flex-wrap:wrap; padding:14px; margin:20px 0 8px; border:1px solid var(--border); border-radius:13px; background:#f5faf7; }
    .operation-tab { flex:1 1 160px; min-height:46px; border:1px solid #c6dccd; border-radius:11px; background:#fff; font:inherit; color:#215037; font-size:.79rem; font-weight:800; cursor:pointer; padding:11px 15px; }
    .operation-tab:hover { border-color:var(--green); }
    .operation-tab.active { background:var(--green); color:#fff; border-color:var(--green); box-shadow:0 5px 12px rgba(20,100,58,.13); }
    .operation-tab:focus-visible { outline:2px solid var(--green); outline-offset:2px; }
    .analysis-tabs { display:flex; flex-wrap:wrap; gap:8px; padding:10px 0 13px; margin-top:18px; margin-bottom:16px; border-bottom:1px solid var(--border); }
    .analysis-tab { padding:10px 20px; min-width:130px; border-radius:11px; border:1px solid var(--border); background:#f3f8f5; color:#274637; font:inherit; font-size:.77rem; font-weight:800; cursor:pointer; }
    .analysis-tab:hover { border-color:var(--green); }
    .analysis-tab.active { background:var(--green); color:#fff; border-color:var(--green); }
    .analysis-tab:focus-visible { outline:2px solid var(--green); outline-offset:2px; }
    .indicator-subtabs { display:flex; flex-wrap:wrap; gap:10px; margin:12px 0 18px; }
    .indicator-subtab { border:1px solid var(--border); border-radius:11px; background:#f3f8f5; color:#274637; padding:10px 20px; min-width:145px; font:inherit; font-size:.77rem; font-weight:800; cursor:pointer; }
    .indicator-subtab:hover { border-color:var(--green); }
    .indicator-subtab.active { background:var(--green); color:#fff; border-color:var(--green); }
    .indicator-subtab:focus-visible { outline:2px solid var(--green); outline-offset:2px; }
    .dash-controlbar { display:flex; align-items:end; justify-content:space-between; flex-wrap:wrap; gap:12px; margin:16px 0 12px; }
    .dash-controlgroup { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
    .dash-controlgroup label { display:flex; flex-direction:column; gap:5px; font-size:.69rem; font-weight:700; color:#465c50; }
    .dash-controlgroup input,.dash-controlgroup select { background:#fff; padding:9px; border-radius:9px; border:1px solid var(--border); max-width:210px; font-size:.73rem; color:var(--text); }
    .dash-kpis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin:14px 0 20px; }
    .kpi-card { display:flex; flex-direction:column; gap:5px; padding:17px 16px; min-height:118px; border-radius:14px; border:1px solid var(--border); background:linear-gradient(150deg,#fbfdfc,#f3f9f5); }
    .kpi-card span { color:#62776b; font-size:.73rem; font-weight:700; }
    .kpi-card strong { color:#166943; font-size:1.65rem; font-weight:850; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
    .kpi-card small { font-size:.65rem; color:#7a857f; line-height:1.4; }
    .dash-graphs { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin:18px 0; }
    .dash-graph { border:1px solid var(--border); background:#fff; border-radius:15px; padding:14px; min-width:0; box-shadow:0 5px 14px rgba(15,50,31,.025); }
    .dash-graph:last-child:nth-child(odd) { grid-column:1/-1; }
    .dash-graph-heading { display:flex; flex-wrap:wrap; gap:6px; align-items:baseline; justify-content:space-between; margin:0 0 12px; }
    .dash-graph-heading h4 { font-size:.84rem; color:#203c2c; margin:0; }
    .dash-graph-heading span { font-size:.67rem; color:#6b7b71; }
    .dash-svg { display:block; width:100%; height:auto; min-height:140px; }
    .dash-no-data { display:grid; place-items:center; padding:30px 15px; min-height:165px; text-align:center; color:#708477; font-size:.72rem; background:#fafcfb; border-radius:10px; }
    .dash-sample { border:1px solid #efd39d; background:#fff7e7; color:#684a19; padding:12px 15px; border-radius:12px; font-size:.72rem; line-height:1.5; }
    .dash-sample strong { margin-right:8px; }
    .dash-executive-text { margin:15px 0; padding:16px; border:1px solid var(--border); border-radius:13px; background:#f8fbf9; font-size:.75rem; line-height:1.6; color:#435f4e; }
    .dash-executive-text strong { font-size:.8rem; color:#1a4a32; }
    .dash-executive-text p { margin:6px 0 0; }
    @media(max-width:1150px){.dash-kpis { grid-template-columns:repeat(2,minmax(0,1fr)); }}
    @media(max-width:780px){.dash-graphs { grid-template-columns:1fr; }.dash-graph:last-child:nth-child(odd){grid-column:auto;} }
    @media(max-width:460px){.dash-kpis { grid-template-columns:1fr; }.dash-controlgroup label,.dash-controlgroup input,.dash-controlgroup select{max-width:none;width:100%} }

    .executive-summary-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:18px; }
    .executive-summary-section { border:1px solid var(--border); border-radius:13px; padding:16px; background:#fbfdfc; }
    .executive-summary-section h4 { font-size:.82rem; margin:0 0 12px; color:var(--text); }
    .executive-summary-section p { font-size:.72rem; margin:8px 0; color:var(--muted); }
    @media (max-width:650px) { .executive-summary-grid { grid-template-columns:1fr; } }

    .analysis-metrics { grid-template-columns:repeat(4,minmax(0,1fr)); }
    @media(max-width:880px) { .analysis-metrics { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media(max-width:480px) { .analysis-tab { min-width:0; flex:1 1 auto; padding:10px; } }
    .module-heading { display:flex; align-items:start; justify-content:space-between; flex-wrap:wrap; gap:12px; }
    .back-link { display:inline-flex; gap:7px; align-items:center; text-decoration:none; }
    .module-filters { display:flex; gap:10px; flex-wrap:wrap; align-items:end; margin:18px 0; }
    .module-filters label { display:flex; flex-direction:column; gap:5px; font-size:.68rem; color:var(--muted); }
    .module-filters input { border:1px solid var(--border); border-radius:10px; padding:9px; background:#fff; color:var(--text); max-width:190px; }
    .module-summary { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin:18px 0; }
    .module-stat { background:#fbfdfc; border:1px solid var(--border); padding:17px; border-radius:13px; }
    .module-stat span { display:block; font-size:.68rem; color:var(--muted); }
    .module-stat strong { display:block; margin-top:8px; font-size:1.65rem; color:var(--green); }
    .module-notice { margin-top:15px; padding:12px; border:1px solid var(--border); border-radius:12px; font-size:.72rem; color:var(--muted); background:#fbfdfc; }
    .module-tablewrap { margin-top:16px; max-width:100%; overflow:auto; border:1px solid var(--border); border-radius:12px; }
    .module-table { border-collapse:collapse; width:100%; min-width:560px; font-size:.7rem; }
    .module-table th,.module-table td { padding:11px; border-bottom:1px solid var(--border); text-align:left; white-space:pre-wrap; vertical-align:top; }
    .module-table th { background:#f2f7f4; white-space:nowrap; }

    .quality-demo-banner{display:flex;flex-direction:column;gap:4px;margin:12px 0 16px;border:1px solid #edcd85;border-radius:12px;padding:13px 15px;background:#fff5da;color:#6b4810;font-size:.75rem}
    .quality-demo-banner strong{font-size:.75rem;letter-spacing:.025em}
    .quality-demo-banner[hidden]{display:none}
    .quality-heading{font-size:1.02rem;margin:10px 0 14px}

    .q-modebar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:14px 0 18px; border-bottom:1px solid var(--border); padding-bottom:16px; }
    .q-mode-btn { flex:0 1 210px; border:1px solid var(--border); background:#eff6f1; color:#225039; border-radius:11px; font-weight:800; font-size:.8rem; min-height:43px; padding:10px 15px; cursor:pointer; }
    .q-mode-btn.active {background:var(--green);color:#fff;border-color:var(--green)}
    .q-mode-btn:focus-visible,.q-preset-bar button:focus-visible,.q-select-actions button:focus-visible {outline:2px solid var(--green);outline-offset:2px}
    #qExplorePane[hidden],#qReportPane[hidden] {display:none !important}
    .q-explore-pane {display:block;}
    .q-explore-header {display:flex;align-items:start;gap:16px;justify-content:space-between;flex-wrap:wrap;margin:0 0 16px;}
    .q-explore-header h3 {font-size:1rem;margin:0 0 6px}
    .q-explore-header p {font-size:.72rem;color:var(--muted);margin:0;line-height:1.55}
    .q-explore-actions {display:flex;align-items:center;flex-wrap:wrap;gap:9px;}
    .q-explore-primary {display:grid;grid-template-columns:minmax(160px,1fr) minmax(240px,2fr);gap:12px;margin:8px 0 15px;max-width:880px;}
    .q-explore-primary label {display:flex;flex-direction:column;gap:6px;font-size:.72rem;font-weight:750;color:#395747;}
    .q-explore-primary input,.q-explore-primary select {width:100%;border:1px solid #c9dbd0;border-radius:10px;padding:11px 12px;background:#fff;color:var(--text);font-size:.75rem;}
    .q-preset-bar {display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 16px;padding:12px 14px;background:#f5faf7;border:1px solid var(--border);border-radius:12px;}
    .q-preset-bar span {font-size:.73rem;font-weight:850;color:#2c503b;margin-right:6px;}
    .q-preset-bar button,.q-select-actions button {border:1px solid #c8dacf;background:#fff;color:#256043;cursor:pointer;padding:8px 11px;border-radius:9px;font-size:.7rem;font-weight:750;}
    .q-preset-bar button:hover,.q-select-actions button:hover {background:#e1f2e7;border-color:var(--green)}
    .q-explore-filters {display:grid;grid-template-columns:minmax(170px,.75fr) minmax(260px,1.1fr) minmax(300px,1.9fr);gap:12px;margin:12px 0 15px;align-items:stretch;}
    .q-explore-filters fieldset {margin:0;min-width:0;border:1px solid var(--border);border-radius:12px;padding:12px;background:#fbfdfc;}
    .q-explore-filters legend {font-size:.74rem;font-weight:850;color:#245439;padding:0 5px}
    .q-check-options {display:flex;gap:6px;flex-wrap:wrap;max-height:155px;overflow-y:auto;align-content:flex-start;}
    .q-item-options {max-height:185px;}
    .q-choice {display:inline-flex;align-items:center;gap:6px;max-width:100%;border:1px solid #d9e6dd;border-radius:8px;padding:7px 9px;background:#fff;color:#2b4d37;font-size:.69rem;line-height:1.4;cursor:pointer;}
    .q-choice:hover {background:#edf7ef}
    .q-choice:has(input:checked){border-color:#76ac88;background:#eaf6ed}
    .q-choice input {width:15px;height:15px;flex-shrink:0;accent-color:var(--green);margin:0;}
    .q-week-options .q-choice {min-width:61px;}
    .q-item-options .q-choice {flex:1 1 160px;}
    .q-select-actions {display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px;}
    .q-explore-feedback {font-size:.75rem;color:#3d5f48;line-height:1.5;margin:13px 0;padding:11px 13px;border:1px solid var(--border);background:#f6faf7;border-radius:10px;}
    .q-explore-stats {margin:14px 0 20px}
    .q-explore-visual {border:1px solid var(--border);background:#fff;border-radius:14px;padding:15px;margin:15px 0;}
    .q-explore-visual h4 {font-size:.84rem;color:#214532;margin:0 0 6px}
    .q-explore-visual p {font-size:.71rem;color:var(--muted);line-height:1.5;margin:0 0 13px}
    .q-explore-legend {display:flex;gap:11px 15px;flex-wrap:wrap;margin:10px 0 14px;}
    .q-explore-legend span {display:flex;align-items:center;gap:7px;font-size:.69rem;color:#304b3c;}
    .q-explore-legend i {width:14px;height:5px;border-radius:999px;display:inline-block;flex-shrink:0;}
    .q-explore-chart {display:block;width:100%;height:auto;max-height:340px;}
    .q-explore-empty {padding:23px;border:1px dashed #b9d1bf;border-radius:12px;background:#fafdfa;color:#607966;font-size:.74rem;line-height:1.55;text-align:center;}
    .q-explore-table {margin:16px 0;max-height:500px;}
    .q-explore-table table {min-width:650px;}
    .q-explore-table th,.q-explore-table td {font-size:.71rem;white-space:nowrap;text-align:center;}
    .q-explore-table td:last-child {color:#136442;font-weight:750;}
    .q-explore-help {font-size:.69rem!important;color:var(--muted);line-height:1.65;margin:10px 1px!important;}
    @media(max-width:1080px){.q-explore-filters{grid-template-columns:1fr 1fr}.q-items-filter{grid-column:1/-1;}}
    @media(max-width:650px){.q-explore-primary,.q-explore-filters{grid-template-columns:1fr}.q-items-filter{grid-column:auto}.q-mode-btn{flex:1 1 auto}}

    .quality-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:15px 0}
    .quality-toolbar label:not(.quality-upload){display:flex;flex-direction:column;gap:5px;font-size:.7rem;color:var(--muted)}
    .quality-toolbar input,.quality-toolbar select{padding:10px;border:1px solid var(--border);border-radius:10px;background:#fff;font:inherit;max-width:220px;font-size:.75rem}
    .quality-upload{display:inline-flex;align-items:center;cursor:pointer;font-size:.72rem}
    .quality-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}
    .quality-table{min-width:900px}
    .quality-table th{font-size:.66rem;min-width:105px;text-align:center;white-space:normal}
    .quality-criterion-kind {display:block;font-size:.59rem;line-height:1.4;color:#557b65;font-weight:700;margin-top:5px;}
    .quality-criteria-details {margin:20px 0 8px;border:1px solid var(--border);border-radius:12px;padding:12px;background:#f9fcfa;}
    .quality-criteria-details summary {font-size:.76rem;font-weight:800;color:#24553a;cursor:pointer;padding:4px 0;}
    .quality-criteria-details .module-tablewrap {margin-top:12px;background:#fff;}
    .quality-criteria-table {min-width:690px;}
    .quality-criteria-table th {font-size:.69rem;}
    .quality-criteria-table td {font-size:.72rem;line-height:1.5;}
    .quality-criteria-help {color:var(--muted);font-size:.7rem;line-height:1.55;margin:12px 2px 0;}

    .quality-table td{font-size:.71rem;text-align:center}
    .quality-table td:first-child,.quality-table th:first-child{text-align:left;position:sticky;left:0;background:#fff;min-width:180px}
    .quality-table th:first-child{background:#f2f7f4}
    .quality-week-table{margin-top:24px;max-width:560px}
    .quality-week-table h4{font-size:.81rem;margin:0 0 10px}
    @media(max-width:650px){.quality-stats{grid-template-columns:1fr}}
    .module-empty { padding:30px; text-align:center; color:var(--muted); font-size:.78rem; }
    @media(max-width:780px) { .module-summary { grid-template-columns:1fr 1fr; } }
  </style>
</head>

function evaluate(r,config,items){

   Array.isArray(r.incumplimientos)?r.incumplimientos:
   Array.isArray(r.items)?r.items:Array.isArray(r.failures)?r.failures:
   Array.isArray(r.detalles)?r.detalles:Array.isArray(r.observaciones)?r.observaciones:[];

 const names=new Map(items.map(([id,name])=>[norm(name),String(id)]));
 const failed=new Set();let unknown=false;
 for(const v of values){
   if(v&&typeof v==="object"&&v.cantidad!==undefined&&Number(v.cantidad)<=0)continue;
   const item=v&&typeof v==="object"?v.idItemDocumento??v.idItem??v.itemId??v.id??v.item??v.nombre??v.name??v.idObservacion:v;
   const txt=String(item??"").trim();
   if(!txt)continue;
   if(config.conformIds.includes(txt)||/^(ramo\s+)?conforme$/.test(norm(txt)))continue;
   const found=ids.get(txt)||names.get(norm(txt));
   if(found)failed.add(found);else unknown=true;

 return {failed,unknown};
}

function compareSvg(series,periodLabels){
 const active=series.filter(s=>s.values.some(v=>v!==null&&Number.isFinite(v)));
 if(!active.length||!periodLabels.length)return '<p class="q-explore-empty">No hay suficientes evaluaciones para dibujar la comparación.</p>';
 const w=940,h=320,left=50,right=18,top=24,bottom=58,plotW=w-left-right,plotH=h-top-bottom;
 const sx=i=>left+(periodLabels.length===1?plotW/2:i*plotW/(periodLabels.length-1));
 const sy=value=>top+plotH-Math.max(0,Math.min(100,value))/100*plotH;
 const palette=["#147b4b","#3264a8","#b57122","#9a4b8c","#37868a","#6c8437"];
 let svg=[];
 for(let tick=0;tick<=4;tick++){
  const value=tick*25,y=sy(value);
  svg.push('<line x1="'+left+'" x2="'+(w-right)+'" y1="'+y+'" y2="'+y+
    '" stroke="#dbe8df" stroke-dasharray="4 5"/>');
  svg.push('<text x="'+(left-9)+'" y="'+(y+4)+'" text-anchor="end" font-size="13" fill="#64766b">'+value+'%</text>');
 }
 periodLabels.forEach((name,i)=>{
  if(periodLabels.length>15&&i%2===1)return;
  const x=sx(i);
  svg.push('<text x="'+x+'" y="'+(h-20)+'" text-anchor="end" transform="rotate(-28 '+x+' '+(h-20)+
  ')" font-size="11" fill="#556d5f">'+esc(name)+'</text>');
 });
 active.slice(0,5).forEach((set,index)=>{
  const color=palette[index%palette.length],pieces=[];let points=[];
  set.values.forEach((v,i)=>{
   if(v===null||!Number.isFinite(v)){if(points.length)pieces.push(points);points=[];return;}
   points.push([sx(i),sy(v)]);
  });
  if(points.length)pieces.push(points);
  pieces.forEach(p=>svg.push('<polyline points="'+p.map(v=>v.join(",")).join(" ")+
   '" stroke="'+color+'" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>'));
  set.values.forEach((v,i)=>{
   if(v===null||!Number.isFinite(v))return;
   const x=sx(i),y=sy(v);
   svg.push('<circle cx="'+x+'" cy="'+y+'" r="4" fill="'+color+'"><title>'+
     esc(set.label+' · '+periodLabels[i]+': '+Math.round(v*10)/10+'%')+'</title></circle>');
  });
 });
 return '<div class="q-explore-legend">'+active.slice(0,5).map((set,i)=>
   '<span><i style="background:'+palette[i%palette.length]+'"></i>'+esc(set.label)+'</span>').join("")+'</div>'+
   '<svg class="q-explore-chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Evolución de conformidad por ítem y período">'+
   svg.join("")+'</svg>'+
   (active.length>5?'<p class="q-explore-help">El gráfico muestra cinco ítems como máximo; la tabla incluye todos los seleccionados.</p>':"");
}
function analyzeComparison(rows,group,items,selectedIds,years,weeks,exactPeriods,search){
 const validIds=new Set(items.map(x=>x[0]));
 const chosen=items.filter(([id])=>selectedIds.has(id)&&validIds.has(id));
 const out=new Map(),invalid=[];
 rows.forEach(r=>{
  if(!real(r))return;
  const [year,week]=period(r);
  if(!year||!week)return;
  const per=year+'-'+String(week).padStart(2,"0");
  if(exactPeriods!==null&&!exactPeriods.has(per))return;
  if(exactPeriods===null&&((years!==null&&!years.has(year))||(weeks!==null&&!weeks.has(week))))return;
  if(search&&!norm(worker(r)+' '+(r.colaborador??r.sembrador??r.empleado??"")).includes(norm(search)))return;
  const ev=evaluate(r,group,items);
  if(ev.unknown){invalid.push(r);return;}
  let row=out.get(per);
  if(!row){row={year,week,label:year+' · S'+String(week).padStart(2,"0"),n:0,overall:0,selected:0,ids:new Map(chosen.map(([id])=>[id,0]))};out.set(per,row)}
  row.n++;
  if(!ev.failed.size)row.overall++;
  if(!chosen.some(([id])=>ev.failed.has(id)))row.selected++;
  for(const [id] of chosen)if(!ev.failed.has(id))row.ids.set(id,row.ids.get(id)+1);
 });
 return {periods:[...out.values()].sort((a,b)=>a.year-b.year||a.week-b.week),chosen,excluded:invalid.length};
}

function calc(records,group,items){
 const people=new Map();let excluded=0;
 for(const r of records){
   const failure=evaluate(r,group,items);
   if(failure.unknown){excluded++;continue;}
   const id=String(r.colaborador||r.sembrador||r.empleado||worker(r)||"Sin código");
   if(!people.has(id))people.set(id,{name:worker(r)||id,id,samples:0,pass:0,issues:new Map(items.map(([item])=>[item,0]))});
   const p=people.get(id);p.samples++;if(!failure.failed.size)p.pass++;
   for(const id of failure.failed)p.issues.set(id,p.issues.get(id)+1);
 }
 return {rows:[...people.values()].sort((a,b)=>a.name.localeCompare(b.name,"es")),excluded};
}

         const pattern=n%7;
         const fails=pattern===1||pattern===4?[items[n%items.length][0]]:
           pattern===6?[items[n%items.length][0],items[(n+1)%items.length][0]]:[];

 function refresh(){
   const c=groups[selectedGroup],items=cols();
   setViewNotice();
   if(c.pending&&!demoMode){area.innerHTML='<div class="module-notice">Mallas no tiene ítems configurados en el formulario original. No se inventan columnas.</div>';reportRows=[];return;}
   if(c.external&&!demoMode&&!items.length){area.innerHTML='<div class="module-notice">Los ítems del Cortador provienen de un catálogo externo que no está incluido en GitHub. Importe JSON con "registros" y "catalogoItems" para obtener los nombres reales.</div>';reportRows=[];return;}
   const rows=active().filter(r=>(!y.value||period(r)[0]===Number(y.value))&&(!w.value||period(r)[1]===Number(w.value))&&
     (!search.value||norm(worker(r)+" "+(r.colaborador||r.sembrador||"")).includes(norm(search.value))));
   const res=calc(rows,c,items);

     '<div class="module-notice"><strong>Solo demostración visual:</strong> estos criterios ilustrativos no existen en el catálogo original de esta modalidad. Se reemplazarán por los oficiales cuando estén disponibles.</div>':"";
   const head=reportHeaders.map((x,i)=>{
     const entry=i>=2&&i<items.length+2?c.meta?.[items[i-2][0]]:null;
     const details=entry?.subitems?.length?"Subítems: "+entry.subitems.join("; "):"";

 async function importQualityFile(event){
   const file=event.target.files[0];if(!file)return;
   try{
     if(file.size>5*1024*1024)throw Error("Archivo superior a 5 MB.");
     const raw=JSON.parse(await file.text()),list=Array.isArray(raw)?raw:raw.registros;
     if(!Array.isArray(list)||list.length>20000||!list.every(x=>x&&typeof x==="object"&&!Array.isArray(x)))
       throw Error("Se espera una lista JSON de registros (máximo 20.000).");
     const catalog=Array.isArray(raw.catalogoItems)?raw.catalogoItems:null;
     if(catalog&&groups[selectedGroup].external){const items=catalog.map(x=>Array.isArray(x)?x:[x.id??x.idItem,x.nombre??x.name])
       .filter(x=>x?.length===2&&x[0]!=null&&x[1]);localStorage.setItem(key(areaId,mod.id+"_quality_catalog_"+selectedGroup),JSON.stringify(items));}
     storedRows=list.map(x=>({...x,__calidadGrupo:rowRole(x,groups)||selectedGroup}));
     records=storedRows;demoMode=false;
     localStorage.setItem(key(areaId,storageKey),JSON.stringify(storedRows));
     note.textContent=records.length+" evaluaciones importadas localmente. Los registros sin modalidad se asignaron a "+groups[selectedGroup].label+". Sin conexión automática a Producción.";
     periods();refresh();syncExplore(true);
   }catch(e){note.textContent="Error al importar: "+e.message;}finally{event.target.value="";}
 }

 let selectedYears=null,selectedWeeks=null,selectedItems=new Set(),exactPeriods=null,exportComparison=null;

  element.innerHTML=rows.map(([value,label])=>'<label class="q-choice"><input type="checkbox" data-compare="'+

   '><span>'+esc(label)+'</span></label>').join("");

   label:name,values:periods.map(r=>r.n?100*r.ids.get(id)/r.n:null)

   String(r.year),"S"+String(r.week).padStart(2,"0"),String(r.n),
   ...chosen.map(([id])=>format(r.ids.get(id),r.n)),format(r.selected,r.n)

    '<tr><td colspan="'+th.length+'" class="module-empty">No hay evaluaciones para los años, semanas, ítems y colaborador seleccionados.</td></tr>';

}

function bandejasTimeHours(r){

function lineGraph(data,caption,percent=false){

 ceiling=Math.max(ceiling,percent?100:1);

 data.forEach((p,i)=>{if(p.value===null){if(current.length)chunks.push(current);current=[]}else current.push([sx(i),sy(p.value)])});

 for(let tick=0;tick<=4;tick++){
  const val=ceiling*tick/4,y=sy(val);

  svg.push('<text x="'+(L-9)+'" y="'+(y+4)+'" text-anchor="end" font-size="12" fill="#64776c">'+clean(percent?Math.round(val)+"%":nf.format(val))+'</text>');
 }
 for(const points of chunks){
  svg.push('<polyline fill="none" stroke="#15704d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" points="'+points.map(p=>p.join(",")).join(" ")+'"/>');
 }
 data.forEach((p,i)=>{
  const x=sx(i);
  svg.push('<text x="'+x+'" y="'+(H-16)+'" text-anchor="middle" font-size="12" fill="#64776c">'+clean(p.label)+'</text>');
  if(p.value!==null){
   const y=sy(p.value);
   svg.push('<circle cx="'+x+'" cy="'+y+'" r="5" fill="#15704d"><title>'+clean(p.label+" · "+nf.format(p.value)+(percent?"%":""))+'</title></circle>');
  }
 });
 return '<svg class="dash-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+clean(caption)+'">'+svg.join("")+'</svg>';

function barGraph(data,caption,unit="",maxRows=6){

 const W=650,L=180,R=65,barH=36,H=rows.length*barH+24,avail=W-L-R,highest=Math.max(...rows.map(x=>x.value),1);

   '<rect x="'+L+'" y="'+y+'" width="'+avail+'" height="22" rx="5" fill="#eff5f1"/>'+

function qualityRole(r,groups){

 if(groups[role])return role;

  if(Number(r.modalidad)===2)return "cortador-spider";

 }
 if(groups.spider&&/spider|cremon/.test(role))return "spider";

function qualityCatalog(modId,groupId){

  try{stored=JSON.parse(localStorage.getItem("flowerlogix_jn_data_produccion_"+modId+
   "_quality_catalog_"+groupId)||"[]")}catch{}

 const list=Array.isArray(stored)&&stored.length?stored:group.items;

  .map(i=>[String(i[0]),String(i[1])]).filter(([id,name])=>
    !group.conformIds?.includes(id)&&!/^(ramo\s+)?conforme$/.test(norm(name)));

function failuresOf(r,group,items){
 if(r.esMuestraReal===false||r.noRealizarMuestra===true)return null;
 const state=norm(r.estadoMuestra??r.resolucion??"");
 if(/no.?realizar.?muestra|no.?evaluada|sin.?muestra/.test(state))return null;
 const raw=Array.isArray(r.fallosDetalle)?r.fallosDetalle:
  Array.isArray(r.incumplimientos)?r.incumplimientos:
  Array.isArray(r.items)?r.items:Array.isArray(r.itemsNombres)?r.itemsNombres:
  Array.isArray(r.failures)?r.failures:null;
 if(!raw&&!r.conformeSeleccionado)return null;
 if(items.length===0)return null;
 const ids=new Map(items.map(([id])=>[id,id])),names=new Map(items.map(([id,name])=>[norm(name),id]));
 const failed=new Set();let unknown=false;
 for(const value of raw??[]){
  if(value&&typeof value==="object"&&valid(value.cantidad)&&Number(value.cantidad)===0)continue;
  const item=value&&typeof value==="object"?(value.idItemDocumento??value.idItem??value.itemId??value.id??value.item??value.nombre??value.name):value;
  const key=String(item??"").trim();
  if(!key||group.conformIds?.includes(key)||/^(ramo\s+)?conforme$/.test(norm(key)))continue;

   (view==="rendimiento"||roleIDs.length<=1?"":'<label>Modalidad<select id="dashRole">'+roleIDs.map(id=>
    '<option value="'+clean(id)+'">'+clean(roles[id].label)+'</option>').join("")+'</select></label>')+
   '</div><button type="button" class="btn-secondary" id="dashDemoButton">Ver registros reales</button></div>'+
   '<div id="dashFeedback"></div><div id="dashContents"></div>';
 const find=id=>panel.querySelector("#"+id),
 from=find("dashFrom"),to=find("dashTo"),worker=find("dashWorker"),
 role=find("dashRole"),msg=find("dashFeedback"),output=find("dashContents"),switcher=find("dashDemoButton");
 const renderNow=()=>{
  const labor=filterPeriod(enrichedLabor(mod.id,demo?fakeLabor:realLabor,demo?fakeTimes:realTimes),
   from.value,to.value,worker.value);
  const quality=demo?fakeQuality:realQuality;
  const unfiltered=filterPeriod(quality,from.value,to.value,worker.value);
  const note=(!demo&&!labor.length&&!unfiltered.length)?"No hay datos reales para el período o los filtros seleccionados.":"";
  msg.innerHTML=sharedNotice(demo,note);
  switcher.textContent=demo?"Ver registros reales":"Ver datos de prueba";
  if(role&&role.value&&Object.prototype.hasOwnProperty.call(roles,role.value))currentRole=role.value;
  if(view==="rendimiento")output.innerHTML=sectionRend(mod.id,labor);
  else if(view==="calidad")output.innerHTML=sectionQuality(mod.id,quality,currentRole,from.value,to.value,worker.value);
  else output.innerHTML=summarySection(mod.id,labor,quality,currentRole,from.value,to.value,worker.value);
 };
 [from,to,worker].forEach(input=>input.addEventListener("input",renderNow));
 if(role)role.addEventListener("change",renderNow);
 switcher.addEventListener("click",()=>{demo=!demo;renderNow()});
 renderNow();return true;
}
window.ProductionIndicators={render,isoWeek,qualityRole,failuresOf,bandejasTimeHours,qualityData,
 sampleLabor,sampleQuality,sourceQuality,enrichedLabor,matchLaborVariant};
})();
</script>
  <script>
    "use strict";

      },

          {id:"zunchador-rendimiento",name:"Zunchador - Rendimiento",icon:"📊"},
          {id:"digitador-rendimiento",name:"Digitador - Rendimiento",icon:"📊"}

          {id:"tanquista-rendimiento",name:"Tanquista - Rendimiento",icon:"📊"}
        ]
      },
      mirfe: {label:"MIRFE",modules:[]}
    });
    const app = document.getElementById("app");
    const heading = document.getElementById("heading");
    const subtitle = document.getElementById("subtitle");
    const menuLinks = [...document.querySelectorAll("#sidebarMenu [data-area]")];
    const fmt = new Intl.NumberFormat("es-CO", {maximumFractionDigits:2});
    const esc = v => String(v ?? "").replace(/[&<>"']/g, c =>
      ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const moduleURL = (area,id) => "#" + area + "/" + id;
    const dataKey = (area,id) => "flowerlogix_jn_data_" + area + "_" + id;
    const getPerson = r => String(r.sembradorNombre ?? r.colaboradorNombre ?? r.empleadoNombre ?? r.nombreColaborador ??
      r.trabajadorNombre ?? r.sembrador ?? r.colaborador ?? r.empleado ?? "");
    const getDate = r => String(r.fecha ?? r.fechaRegistro ?? "").slice(0,10);
    const getRecords = (area,id) => {
      try {
        const result = JSON.parse(localStorage.getItem(dataKey(area,id)) || "[]");
        return Array.isArray(result) ? result : [];
      } catch { return []; }
    };
    function locationParts() {
      const parts = decodeURIComponent(location.hash.slice(1)).toLowerCase().split("/");
      return {areaId:parts[0], moduleId:parts[1] || ""};
    }
    // Enlaces anteriores por consulta llevan a la nueva navegación sin recarga.
    const legacyArea = new URLSearchParams(location.search).get("area");
    if (!location.hash && Object.prototype.hasOwnProperty.call(AREAS, legacyArea)) {
      history.replaceState(null,"",location.pathname+"#"+legacyArea);
    }

    function renderArea(areaId) {
      const area=AREAS[areaId];
      heading.textContent=area.label;
      subtitle.textContent=area.modules.length
        ? "Seleccione una labor para consultar sus registros e indicadores."
        : "Área sin módulos configurados en Labores JN.";
      if (!area.modules.length) {
        app.innerHTML='<div class="page-kicker">ÁREA / '+esc(area.label.toUpperCase())+'</div>' +
          '<h2 class="page-title">'+esc(area.label)+'</h2>' +
          '<div class="module-notice">Esta área aún no tiene módulos. No se agregaron formularios nuevos.</div>';
        return;
      }
      app.innerHTML='<div class="page-kicker">ÁREA / '+esc(area.label.toUpperCase())+'</div>' +
        '<h2 class="page-title">Módulos de '+esc(area.label)+'</h2>' +
        '<p class="page-description">Se muestran únicamente las labores de la columna izquierda del menú original.</p>' +
        '<div class="module-grid">'+area.modules.map(item =>
          '<a class="module-link" href="'+moduleURL(areaId,item.id)+'">' +
          '<div><small>'+esc(area.label)+'</small><strong>'+esc(item.name)+'</strong></div>' +
          '<span class="module-icon" aria-hidden="true">'+item.icon+'</span></a>'
        ).join("")+'</div>';
    }

    function downloadCSV(rows,columns,fileName) {
      const quote = cell => {
        const value=typeof cell==="object" && cell!==null ? JSON.stringify(cell) : String(cell ?? "");
        const guarded=/^[=+\-@]/.test(value) ? "'"+value : value;
        return '"' + guarded.replaceAll('"','""') + '"';
      };
      const csv="\uFEFF"+[columns.map(quote).join(";"),
        ...rows.map(r=>columns.map(col=>quote(r[col])).join(";"))].join("\r\n");
      const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
      const a=document.createElement("a");
      a.href=url;a.download=fileName+".csv";a.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    }


    // Tabla particular de rendimiento para Bandejas Enraizamiento.
    // Producción registra esquejes por cama y tiempo real por sembrador/fecha.
    function renderBandejasRendimiento(areaId,mod,panel) {
      const fields=["Fecha","Nombre del sembrador","Bloque","Cama","Total esquejes sembrados","Horas trabajadas","Promedio de esquejes por hora"];
      const exampleLabor=[
        {fecha:"2026-10-08",sembrador:"DEMO01",sembradorNombre:"Sembrador de prueba 1",bloque:"B1",cama:"C1",cantidad:1200},
        {fecha:"2026-10-08",sembrador:"DEMO01",sembradorNombre:"Sembrador de prueba 1",bloque:"B1",cama:"C2",cantidad:600},
        {fecha:"2026-10-08",sembrador:"DEMO02",sembradorNombre:"Sembrador de prueba 2",bloque:"B2",cama:"C3",cantidad:1000},
        {fecha:"2026-10-07",sembrador:"DEMO03",sembradorNombre:"Sembrador de prueba 3",bloque:"B3",cama:"C1",cantidad:850}
      ];
      const exampleTimes=[
        {fecha:"2026-10-08",sembrador:"DEMO01",horasExtraMin:30,desplazamientoMin:15,calisteniaMin:15,capacitacionMin:15,otrasLaboresMin:60},
        {fecha:"2026-10-08",sembrador:"DEMO02",horasExtraMin:15,desplazamientoMin:15,calisteniaMin:15,capacitacionMin:15,otrasLaboresMin:45},
        {fecha:"2026-10-07",sembrador:"DEMO03",horasExtraMin:0,desplazamientoMin:15,calisteniaMin:15,capacitacionMin:15,otrasLaboresMin:60}
      ];
      const laborKey=dataKey(areaId,mod.id),timeKey=dataKey(areaId,mod.id+"_tiempos");
      let labor=getRecords(areaId,mod.id),times=getRecords(areaId,mod.id+"_tiempos");
      let demo=labor.length===0;
      const date=r=>String(r.fecha??"").slice(0,10);
      const workerId=r=>String(r.sembrador??r.colaborador??r.codigo??r.sembradorNombre??r.colaboradorNombre??"").trim().toLowerCase();
      const workerName=r=>String(r.sembradorNombre??r.colaboradorNombre??r.nombre??r.sembrador??"Sin nombre");
      const numeric=v=>v!==null&&v!==undefined&&v!==""&&Number.isFinite(Number(v))&&Number(v)>=0;
      const qty=r=>Number(r.cantidad??r.totalEsquejes??r.totalEsquejesSembrados);
      const dayKey=r=>JSON.stringify([date(r),workerId(r)]);
      function calculate(labors,timeRows) {
        const good=labors.filter(r=>r&&date(r)&&workerId(r)&&String(r.bloque??"").trim()&&
          String(r.cama??"").trim()&&Number.isFinite(qty(r))&&qty(r)>0);
        const totals=new Map();
        good.forEach(r=>totals.set(dayKey(r),(totals.get(dayKey(r))||0)+qty(r)));
        // Jornada base: 7,25 h = 435 minutos, una sola vez por sembrador/fecha.
        // Producción guarda "otrasLaboresMin" como suma de desplazamiento,
        // calistenia, capacitación, PMadres y PAbuelas. Se descontará esa suma
        // una única vez; no se deben duplicar sus componentes.
        const BASE_MIN=435;
        const minutes=(r,field)=>numeric(r[field])?Number(r[field]):0;
        const workedMinutes=r=>{
          const extra=minutes(r,"horasExtraMin")||
            (numeric(r.horasExtra)?Number(r.horasExtra)*60:0);
          const desplazamiento=minutes(r,"desplazamientoMin");
          const calistenia=minutes(r,"calisteniaMin");
          const capacitacion=minutes(r,"capacitacionMin");
          const categorias=desplazamiento+calistenia+capacitacion;
          const otrasAgregadas=numeric(r.otrasLaboresMin)
            ? Number(r.otrasLaboresMin)
            : categorias+minutes(r,"pMadresMin")+minutes(r,"pAbuelasMin");
          // Las "otras labores" se calculan sin volver a contar las tres categorías.
          const otrasExclusivas=Math.max(0,otrasAgregadas-categorias);
          return Math.max(0,BASE_MIN+extra-desplazamiento-calistenia-capacitacion-otrasExclusivas);
        };
        const hoursByDay=new Map();
        timeRows.forEach(r=>{
          if(!r||!date(r)||!workerId(r))return;
          // Puede haber una corrección del registro: se utiliza la última
          // entrada del día para no sumar otra jornada base de 7,25 horas.
          hoursByDay.set(dayKey(r),workedMinutes(r)/60);
        });
        const groups=new Map();
        good.forEach(r=>{
          const k=JSON.stringify([date(r),workerId(r),String(r.bloque),String(r.cama)]);
          if(!groups.has(k))groups.set(k,{fecha:date(r),sembrador:workerName(r),bloque:String(r.bloque),
            cama:String(r.cama),esquejes:0,horas:0,conHoras:false});
          const item=groups.get(k),dk=dayKey(r);
          item.esquejes+=qty(r);
          if(hoursByDay.has(dk)&&totals.get(dk)>0){
            item.horas+=hoursByDay.get(dk)*qty(r)/totals.get(dk);
            item.conHoras=true;
          }
        });
        return [...groups.values()].map(r=>({
          ...r,horas:r.conHoras?r.horas:null,
          promedio:r.conHoras&&r.horas>0?r.esquejes/r.horas:null
        })).sort((a,b)=>b.fecha.localeCompare(a.fecha)||a.sembrador.localeCompare(b.sembrador,"es")||
          a.bloque.localeCompare(b.bloque,"es")||a.cama.localeCompare(b.cama,"es"));
      }
      panel.innerHTML='<div class="page-kicker">RENDIMIENTO / BANDEJAS ENRAIZAMIENTO</div>'+
        '<h3 class="quality-heading">Rendimiento por sembrador y cama</h3>'+
        '<div class="module-filters">'+
        '<label>Desde<input id="eDesde" type="date"></label>'+
        '<label>Hasta<input id="eHasta" type="date"></label>'+
        '<label>Sembrador<input id="eSembrador" type="search" placeholder="Nombre del sembrador"></label>'+
        '<label class="btn-primary quality-upload">Importar esquejes JSON<input id="eEsquejesArchivo" type="file" accept=".json,application/json" hidden></label>'+
        '<label class="btn-primary quality-upload">Importar tiempos JSON<input id="eTiemposArchivo" type="file" accept=".json,application/json" hidden></label>'+
        '<button class="btn-secondary" type="button" id="eCSV">Exportar CSV</button>'+
        '<button class="btn-secondary" type="button" id="eLimpiar">Limpiar filtros</button>'+
        '<button class="btn-secondary" type="button" id="eDemo">Ver datos reales</button></div>'+
        '<div id="eDemoAviso" class="quality-demo-banner" role="status"></div>'+
        '<div id="eAviso" class="module-notice">Las horas reales se registran por sembrador y fecha. '+
        'Fórmula: tiempo de labor = 7,25 horas + horas extra − desplazamiento − calistenia − capacitación − otras labores. '+
        'En Producción, otrasLaboresMin ya incluye desplazamiento, calistenia y capacitación; se descuentan una sola vez. '+
        'Si hay varias camas en un día, el tiempo se distribuye proporcionalmente a los esquejes. '+
        'Promedio = esquejes sembrados ÷ horas de labor. Sin registro de tiempos, se muestra —.</div>'+
        '<div class="module-summary analysis-metrics">'+
        '<div class="module-stat"><span>Total esquejes sembrados</span><strong id="eTotal">0</strong></div>'+
        '<div class="module-stat"><span>Horas trabajadas</span><strong id="eHoras">—</strong></div>'+
        '<div class="module-stat"><span>Promedio esquejes/hora</span><strong id="ePromedio">—</strong></div>'+
        '<div class="module-stat"><span>Sembradores</span><strong id="ePersonas">0</strong></div></div>'+
        '<div class="module-tablewrap"><table class="module-table" style="min-width:950px"><thead><tr>'+
        fields.map(f=>'<th>'+esc(f)+'</th>').join("")+'</tr></thead><tbody id="eFilas"></tbody></table></div>';
      const get=id=>panel.querySelector("#"+id);
      const desde=get("eDesde"),hasta=get("eHasta"),buscar=get("eSembrador");
      let visible=[];
      const format=n=>n===null?"—":fmt.format(n);
      function refresh(){
        visible=calculate(demo?exampleLabor:labor,demo?exampleTimes:times).filter(r=>
          (!desde.value||r.fecha>=desde.value)&&(!hasta.value||r.fecha<=hasta.value)&&
          (!buscar.value||r.sembrador.toLowerCase().includes(buscar.value.toLowerCase()))
        );
        const total=visible.reduce((v,r)=>v+r.esquejes,0);
        const hours=visible.reduce((v,r)=>v+(r.horas??0),0);
        const known=visible.filter(r=>r.horas!==null);
        get("eTotal").textContent=fmt.format(total);
        get("eHoras").textContent=known.length?fmt.format(hours):"—";
        get("ePromedio").textContent=hours>0?fmt.format(known.reduce((v,r)=>v+r.esquejes,0)/hours):"—";
        get("ePersonas").textContent=fmt.format(new Set(visible.map(r=>r.sembrador)).size);
        get("eFilas").innerHTML=visible.length?visible.map(r=>
          '<tr><td>'+esc(r.fecha)+'</td><td>'+esc(r.sembrador)+'</td><td>'+esc(r.bloque)+'</td>'+
          '<td>'+esc(r.cama)+'</td><td>'+fmt.format(r.esquejes)+'</td><td>'+format(r.horas)+
          '</td><td>'+format(r.promedio)+'</td></tr>').join(""):
          '<tr><td class="module-empty" colspan="7">Sin registros para esta selección.</td></tr>';
        get("eDemoAviso").hidden=!demo;
        get("eDemoAviso").innerHTML=demo?'<strong>DATOS DE PRUEBA — EJEMPLO</strong>'+
          '<span>Sembradores, fechas, cantidades, horas y promedios ficticios. No se guardan como datos reales.</span>':"";
        get("eDemo").textContent=demo?"Ver datos reales":"Ver datos de prueba";
      }
      [desde,hasta,buscar].forEach(node=>node.addEventListener("input",refresh));
      get("eLimpiar").addEventListener("click",()=>{desde.value="";hasta.value="";buscar.value="";refresh()});
      get("eDemo").addEventListener("click",()=>{demo=!demo;refresh()});
      async function load(event,mode){
        const file=event.target.files[0];if(!file)return;
        try{
          if(file.size>5*1024*1024)throw Error("Archivo mayor de 5 MB.");
          const content=JSON.parse(await file.text());
          const candidates=mode==="labor"?["labor","bandejasEnraizamiento","registros"]:["tiempos","bandejasTiempos","registros"];
          const rows=Array.isArray(content)?content:candidates.map(x=>content?.[x]).find(Array.isArray);
          if(!Array.isArray(rows)||rows.length>20000||!rows.every(r=>r&&typeof r==="object"&&!Array.isArray(r)))
            throw Error("Se requiere una lista JSON válida, máximo 20.000 registros.");
          if(rows.some(r=>!date(r)||!workerId(r)||!(mode==="labor"?
            String(r.bloque??"").trim()&&String(r.cama??"").trim()&&numeric(r.cantidad??r.totalEsquejes??r.totalEsquejesSembrados):
            ["horasExtraMin","horasExtra","desplazamientoMin","calisteniaMin","capacitacionMin",
             "otrasLaboresMin","pMadresMin","pAbuelasMin","horasLaboralesMin","tiempoRealMin"]
              .some(field=>numeric(r[field])))))
            throw Error("Faltan campos requeridos de "+(mode==="labor"?"esquejes":"tiempos")+".");
          localStorage.setItem(mode==="labor"?laborKey:timeKey,JSON.stringify(rows));
          if(mode==="labor")labor=rows;else times=rows;
          demo=false;
          get("eAviso").textContent="Se importaron "+rows.length+" registros de "+(mode==="labor"?"esquejes":"tiempos")+
            " en este navegador. No existe todavía conexión automática con Producción.";
          refresh();
        }catch(e){get("eAviso").textContent="No se pudo importar: "+e.message;}
        finally{event.target.value="";}
      }
      get("eEsquejesArchivo").addEventListener("change",e=>load(e,"labor"));
      get("eTiemposArchivo").addEventListener("change",e=>load(e,"time"));
      get("eCSV").addEventListener("click",()=>{
        if(!visible.length)return;
        const rows=visible.map(r=>Object.fromEntries(fields.map((label,i)=>[label,
          [r.fecha,r.sembrador,r.bloque,r.cama,r.esquejes,
           r.horas===null?"":Number(r.horas.toFixed(4)),
           r.promedio===null?"":Number(r.promedio.toFixed(2))][i]])));
        downloadCSV(rows,fields,"enraizamiento-rendimiento"+(demo?"-DEMO":""));
      });
      refresh();
    }

    function renderModule(areaId,mod) {
      const area=AREAS[areaId];
      const operationMenus={
        "desbotonado-mallas":[
          {id:"pompon",label:"Desbotón Pompón",qualityGroups:["pompon"]},
          {id:"spider",label:"Desbotón Spider",qualityGroups:["spider"]},
          {id:"mallas",label:"Malla",qualityGroups:["mallas"]}
        ],
        "corte":[
          {id:"cortador",label:"Cortador",qualityGroups:["cortador-pompon","cortador-spider"]},
          {id:"garruchero",label:"Transportador",qualityGroups:["garruchero"]},
          {id:"recogedor",label:"Recogedor",qualityGroups:["recogedor"]}
        ]
      };
      const operationOptions=areaId==="produccion"?(operationMenus[mod.id]||[]):[];
      let selectedOperation=operationOptions[0]?.id??null;
      const selectedQualityGroups=()=>operationOptions.find(v=>v.id===selectedOperation)?.qualityGroups||null;
      const matchOperation=r=>!selectedOperation||window.ProductionIndicators.matchLaborVariant(mod.id,r,selectedOperation);
      const tabs=[
        {id:"rendimiento",label:"Rendimiento"},
        {id:"calidad",label:"Calidad"},
        {id:"indicadores",label:"Indicadores"}
      ];
      let activeTab="rendimiento";
      let activeIndicator="rendimiento";
      heading.textContent=mod.name;
      subtitle.textContent=area.label+" / Consulta de información";
      app.innerHTML='<div class="module-heading"><div>' +
        '<div class="page-kicker">'+esc(area.label.toUpperCase())+' / ANÁLISIS</div>' +
        '<h2 class="page-title">'+esc(mod.name)+'</h2>' +
        '<p class="page-description">Seleccione la vista de rendimiento, calidad o indicadores de esta labor.</p></div>' +
        '<a class="btn-secondary back-link" href="#'+areaId+'">← Volver a '+esc(area.label)+'</a></div>' +
        (operationOptions.length?
          '<nav class="operation-tabs" aria-label="Labores de '+esc(mod.name)+'">'+
          operationOptions.map(item=>'<button type="button" class="operation-tab'+
            (item.id===selectedOperation?' active':'')+'" data-operation="'+item.id+
            '" aria-pressed="'+(item.id===selectedOperation?'true':'false')+'">'+esc(item.label)+'</button>').join("")+
          '</nav>':'')+
        '<div class="analysis-tabs" role="tablist" aria-label="Vistas de '+esc(mod.name)+'">' +
        tabs.map(tab=>'<button type="button" role="tab" class="analysis-tab'+
          (tab.id===activeTab?' active':'')+'" data-tab="'+tab.id+'" aria-selected="'+
          (tab.id===activeTab?'true':'false')+'">'+tab.label+'</button>').join("") +
        '</div><section id="moduleTabPanel" role="tabpanel" aria-live="polite"></section>';
      const panel=document.getElementById("moduleTabPanel");
      const tabButtons=[...app.querySelectorAll("[data-tab]")];
      const operationButtons=[...app.querySelectorAll("[data-operation]")];

      function renderIndicators() {
        const sections=[
          {id:"rendimiento",label:"Indicadores - Rendimiento"},
          {id:"calidad",label:"Indicadores - Calidad"}
        ];
        // Por ahora, el resumen ejecutivo se habilita únicamente en Producción.
        if(areaId==="produccion")sections.push({id:"resumen",label:"Resumen ejecutivo"});
        panel.innerHTML='<div class="page-kicker">INDICADORES / '+esc(mod.name.toUpperCase())+'</div>'+
          '<h3 class="quality-heading">Indicadores de '+esc(mod.name)+'</h3>'+
          '<nav class="indicator-subtabs" aria-label="Tipos de indicadores">'+
          sections.map(section=>'<button type="button" class="indicator-subtab" data-indicator="'+section.id+
            '" aria-pressed="false">'+section.label+'</button>').join("")+'</nav>'+
          '<section id="indicatorContent" aria-live="polite"></section>';
        const buttons=[...panel.querySelectorAll("[data-indicator]")];
        const content=panel.querySelector("#indicatorContent");

        function executiveQualityStatus(record) {
          if(!record||record.esMuestraReal===false||record.noRealizarMuestra===true)return null;
          const estado=String(record.estadoMuestra||record.resolucion||"").toLowerCase();
          if(estado.includes("no realizar")||estado.includes("no evaluada"))return null;
          if(Array.isArray(record.fallosDetalle)) {
            const anyFailure=record.fallosDetalle.some(item=>
              Number(item?.cantidad??item?.total??1)>0);
            return !anyFailure;
          }
          if(typeof record.conformeSeleccionado==="boolean"&&record.conformeSeleccionado)return true;
          const raw=Array.isArray(record.incumplimientos)?record.incumplimientos:
            Array.isArray(record.items)?record.items:null;
          if(raw!==null) {
            const conformeCorte=mod.id==="corte";
            const failures=raw.filter(item=>{
              const id=typeof item==="object"&&item!==null?(item.idItem??item.id??item.nombre):item;
              const str=String(id??"").trim().toLowerCase();
              return str!==""&&str!=="-infinity"&&str!=="conforme"&&str!=="ramo conforme"&&
                !(conformeCorte&&str==="1");
            });
            return failures.length===0;
          }
          if(record.conformeSeleccionado===false)return null;
          return null;
        }

        function renderExecutiveSummary() {
          const rendimiento=getRecords(areaId,mod.id);
          const calidad=getRecords(areaId,mod.id+"_calidad");
          const workersR=new Set(rendimiento.map(getPerson).filter(Boolean)).size;
          const workersQ=new Set(calidad.map(getPerson).filter(Boolean)).size;
          const daysR=new Set(rendimiento.map(getDate).filter(Boolean)).size;
          const daysQ=new Set(calidad.map(getDate).filter(Boolean)).size;
          const assessed=calidad.map(executiveQualityStatus).filter(v=>v!==null);
          const conforme=assessed.filter(Boolean).length;
          const ratio=assessed.length?fmt.format(100*conforme/assessed.length)+"%":"—";
          const qtyConfig={
            "siembra-campo":{label:"Esquejes estimados",calc:r=>Number(r.lineas)*Number(r.densidad),
              valid:r=>r.lineas!==undefined&&r.densidad!==undefined},
            "desbotonado-mallas":{label:"Tallos registrados",calc:r=>Number(r.tallos),
              valid:r=>r.tallos!==undefined},
            "bandejas-enraizamiento":{label:"Esquejes sembrados",calc:r=>Number(r.cantidad??r.totalEsquejes??r.totalEsquejesSembrados),
              valid:r=>r.cantidad!==undefined||r.totalEsquejes!==undefined||r.totalEsquejesSembrados!==undefined}
          }[mod.id];
          const quantities=qtyConfig?rendimiento.filter(r=>qtyConfig.valid(r))
            .map(qtyConfig.calc).filter(n=>Number.isFinite(n)&&n>=0):[];
          const output=quantities.length?fmt.format(quantities.reduce((sum,n)=>sum+n,0)):"—";
          const cards=[
            ["Registros de rendimiento",fmt.format(rendimiento.length)],
            [qtyConfig?qtyConfig.label:"Colaboradores en rendimiento",qtyConfig?output:fmt.format(workersR)],
            ["Evaluaciones de calidad",fmt.format(calidad.length)],
            ["Conformidad de calidad",ratio]
          ];
          content.innerHTML='<p class="page-description">Vista conjunta de rendimiento y calidad para la labor de '+
            esc(mod.name)+'. Los resultados se mantienen separados por indicador.</p>'+
            '<div class="module-summary analysis-metrics">'+cards.map(([label,value])=>
              '<div class="module-stat"><span>'+esc(label)+'</span><strong>'+
              esc(value)+'</strong></div>').join("")+'</div>'+
            '<div class="executive-summary-grid">'+
              '<section class="executive-summary-section"><h4>Rendimiento</h4>'+
                '<p><strong>'+fmt.format(workersR)+'</strong> colaboradores con registros</p>'+
                '<p><strong>'+fmt.format(daysR)+'</strong> días con actividad registrada</p>'+
              '</section>'+
              '<section class="executive-summary-section"><h4>Calidad</h4>'+
                '<p><strong>'+fmt.format(conforme)+'</strong> evaluaciones conformes de '+
                  fmt.format(assessed.length)+' con resultado identificable</p>'+
                '<p><strong>'+fmt.format(workersQ)+'</strong> colaboradores evaluados · '+
                  fmt.format(daysQ)+' días con evaluaciones</p>'+
              '</section>'+
            '</div>'+
            (!rendimiento.length&&!calidad.length?
              '<div class="module-notice">Todavía no hay registros reales importados para generar el resumen ejecutivo.</div>':
              '<div class="module-notice">Los resultados corresponden solo a los datos reales importados. '+
                (calidad.length>assessed.length?
                  (calidad.length-assessed.length)+' evaluaciones sin clasificación de conformidad se excluyeron del porcentaje. ':'')+
                'Los datos de demostración no forman parte del resumen. No existe sincronización automática con Producción.</div>');
        }

        function selectIndicators(view) {
          if(!sections.some(section=>section.id===view))return;
          buttons.forEach(button=>{
            const active=button.dataset.indicator===view;
            button.classList.toggle("active",active);
            button.setAttribute("aria-pressed",String(active));
          });
          if(areaId==="produccion" && window.ProductionIndicators) {
            activeIndicator=view;
            window.ProductionIndicators.render({areaId,mod,view,panel:content,getRecords,
              selectedVariant:selectedOperation,allowedGroups:selectedQualityGroups()});
            return;
          }
          if(view==="resumen"){renderExecutiveSummary();return;}
          const records=getRecords(areaId,view==="rendimiento"?mod.id:mod.id+"_calidad");
          const people=new Set(records.map(getPerson).filter(Boolean));
          const days=new Set(records.map(getDate).filter(Boolean));
          const title=view==="rendimiento"?"Rendimiento":"Calidad";
          const metrics=[
            [view==="rendimiento"?"Registros de rendimiento":"Evaluaciones de calidad",records.length],
            ["Colaboradores distintos",people.size],
            ["Días con registros",days.size]
          ];
          content.innerHTML='<p class="page-description">Indicadores de '+title.toLowerCase()+
            ' de esta labor, calculados por separado.</p>'+
            '<div class="module-summary analysis-metrics">'+metrics.map(([label,value])=>
              '<div class="module-stat"><span>'+esc(label)+'</span><strong>'+
              fmt.format(value)+'</strong></div>').join("")+'</div>'+
            '<div class="module-notice">Los indicadores utilizan los datos reales importados en esta sección de '+
            title.toLowerCase()+'. Los registros de prueba no se incluyen en estos totales. '+
            'No hay sincronización automática con la aplicación de Producción.</div>';
        }
        buttons.forEach(button=>button.addEventListener("click",()=>selectIndicators(button.dataset.indicator)));
        selectIndicators(activeIndicator);
      }

      function renderRecordsView(mode) {
        const isQuality=mode==="calidad";
        const title=isQuality?"Calidad":"Rendimiento";
        const key=isQuality?mod.id+"_calidad":mod.id;
        let currentRows=getRecords(areaId,key);
        if(isQuality){window.QualityReports.render({areaId,mod,key,panel,
          allowedGroups:selectedQualityGroups(),initialGroup:selectedQualityGroups()?.[0]});return;}
        if(mod.id==="bandejas-enraizamiento"){renderBandejasRendimiento(areaId,mod,panel);return;}
        panel.innerHTML='<div class="page-kicker">'+title.toUpperCase()+' / '+esc(mod.name.toUpperCase())+'</div>' +
          '<p class="page-description">Registros de '+title.toLowerCase()+' de esta labor.</p>' +
          '<div class="module-filters">' +
          '<label>Desde<input id="filterFrom" type="date"></label>' +
          '<label>Hasta<input id="filterTo" type="date"></label>' +
          '<label>Colaborador<input id="filterWorker" type="search" placeholder="Nombre o código"></label>' +
          '<label class="btn-primary" style="cursor:pointer;color:#fff">Importar JSON<input id="moduleFile" type="file" accept=".json,application/json" hidden></label>' +
          '<button class="btn-secondary" id="exportCSV" type="button">Exportar CSV</button>' +
          '<button class="btn-secondary" id="clearFilters" type="button">Limpiar filtros</button>' +
          '</div>' +
          '<div class="module-notice" id="moduleNotice">Los registros de '+title.toLowerCase()+
          ' se almacenan por separado para esta labor. Importación manual por JSON; sin sincronización automática.</div>' +
          '<div class="module-summary"><div class="module-stat"><span>'+(isQuality?"Evaluaciones":"Registros")+
          '</span><strong id="count">0</strong></div>' +
          '<div class="module-stat"><span>Colaboradores distintos</span><strong id="workers">0</strong></div></div>' +
          '<div id="recordsTable"></div>';
        const from=document.getElementById("filterFrom");
        const to=document.getElementById("filterTo");
        const worker=document.getElementById("filterWorker");
        const selected=()=>currentRows.filter(r=>
          matchOperation(r) &&
          (!from.value || getDate(r)>=from.value) &&
          (!to.value || getDate(r)<=to.value) &&
          (!worker.value || getPerson(r).toLowerCase().includes(worker.value.toLowerCase()))
        );
        function refresh() {
          const rows=selected();
          document.getElementById("count").textContent=fmt.format(rows.length);
          document.getElementById("workers").textContent=fmt.format(new Set(rows.map(getPerson).filter(Boolean)).size);
          const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))].slice(0,35);
          document.getElementById("recordsTable").innerHTML=!rows.length
            ?'<div class="module-empty">No hay registros de '+title.toLowerCase()+' para los filtros seleccionados.</div>'
            :'<div class="module-tablewrap"><table class="module-table"><thead><tr>'+
              keys.map(k=>'<th>'+esc(k)+'</th>').join("")+'</tr></thead><tbody>'+
              rows.slice(0,1000).map(r=>'<tr>'+keys.map(k=>'<td>'+esc(
                r[k]!==null && typeof r[k]==="object" ? JSON.stringify(r[k]) : r[k]
              )+'</td>').join("")+'</tr>').join("")+
              '</tbody></table></div>'+(rows.length>1000
                ?'<p class="page-description">Se muestran los primeros 1.000 registros; la exportación incluye todos los filtrados.</p>':"");
        }
        [from,to,worker].forEach(field=>field.addEventListener("input",refresh));
        document.getElementById("clearFilters").addEventListener("click",()=>{
          [from,to,worker].forEach(field=>field.value="");refresh();
        });
        document.getElementById("moduleFile").addEventListener("change",async event=>{
          const file=event.target.files[0];if(!file)return;
          const notice=document.getElementById("moduleNotice");
          try {
            if(file.size>5*1024*1024)throw Error("El archivo no puede superar 5 MB.");
            const data=JSON.parse(await file.text());
            const list=Array.isArray(data)?data:(Array.isArray(data.registros)?data.registros:null);
            if(!list||!list.every(r=>r&&typeof r==="object"&&!Array.isArray(r)))
              throw Error('Se necesita un arreglo JSON de registros, o un objeto con la propiedad "registros".');
            if(list.length>20000)throw Error("El archivo supera 20.000 registros.");
            let incoming=list;
            if(operationOptions.length){
              incoming=list.map(r=>{
                const hasGroup=r.__laborGrupo||r.tipoLabor||r.tipoLaborNombre||r.rol||r.rolNombre||r.tipoRol;
                return hasGroup?r:{...r,__laborGrupo:selectedOperation};
              });
              const affected=operationOptions.filter(option=>incoming.some(r=>
                window.ProductionIndicators.matchLaborVariant(mod.id,r,option.id))).map(option=>option.id);
              currentRows=[
                ...currentRows.filter(r=>!affected.some(id=>
                  window.ProductionIndicators.matchLaborVariant(mod.id,r,id))),
                ...incoming
              ];
            }else currentRows=incoming;
            localStorage.setItem(dataKey(areaId,key),JSON.stringify(currentRows));
            notice.textContent=incoming.length+" registros de "+title.toLowerCase()+
              " importados para "+(operationOptions.find(x=>x.id===selectedOperation)?.label||mod.name)+
              ". Se conservaron los registros de las otras labores. No son datos en tiempo real.";
            refresh();
          }catch(error){notice.textContent="No se pudo importar: "+error.message;}
          finally{event.target.value="";}
        });
        document.getElementById("exportCSV").addEventListener("click",()=>{
          const rows=selected();if(!rows.length)return;
          const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))];
          downloadCSV(rows,keys,areaId+"-"+mod.id+"-"+mode);
        });
        refresh();
      }

      function selectTab(tabId) {
        if(!tabs.some(tab=>tab.id===tabId))return;
        activeTab=tabId;
        tabButtons.forEach(button=>{
          const selected=button.dataset.tab===tabId;
          button.classList.toggle("active",selected);
          button.setAttribute("aria-selected",String(selected));
          button.tabIndex=selected?0:-1;
        });
        if(tabId==="indicadores")renderIndicators();
        else renderRecordsView(tabId);
      }
      tabButtons.forEach(button=>button.addEventListener("click",()=>selectTab(button.dataset.tab)));
      operationButtons.forEach(button=>button.addEventListener("click",()=>{
        const target=button.dataset.operation;
        if(!operationOptions.some(option=>option.id===target)||target===selectedOperation)return;
        selectedOperation=target;
        operationButtons.forEach(el=>{
          const active=el.dataset.operation===target;
          el.classList.toggle("active",active);
          el.setAttribute("aria-pressed",String(active));
        });
        selectTab(activeTab);
      }));
      selectTab(activeTab);
    }

    function render() {
      const {areaId,moduleId}=locationParts();
      const area=Object.prototype.hasOwnProperty.call(AREAS,areaId)?AREAS[areaId]:null;
      const module=area ? area.modules.find(item=>item.id===moduleId) : null;
      for (const link of menuLinks) {
        const active=Boolean(area) && link.dataset.area===areaId;
        link.classList.toggle("active",active);
        if(active)link.setAttribute("aria-current","page");
        else link.removeAttribute("aria-current");
      }
      if(!area) {
        heading.textContent="Analítica · Sede JN";
        subtitle.textContent="Seleccione un área para consultar sus módulos.";
        app.innerHTML='<div class="page-kicker">FLOWERLOGIX / REPORTES</div>'+
          '<h2 class="page-title">Módulos de análisis</h2>'+
          '<p class="page-description">Seleccione un módulo para visualizar sus registros. También puede filtrar por área desde el menú lateral.</p>'+
          Object.entries(AREAS).map(([key,section])=>
            '<section class="home-section"><div class="home-section-heading"><h3>'+esc(section.label)+'</h3>'+
            '<a class="home-area-link" href="#'+key+'">Ver área →</a></div>'+
            (section.modules.length ? '<div class="module-grid">'+section.modules.map(item=>
              '<a class="module-link" href="'+moduleURL(key,item.id)+'">'+
              '<div><small>'+esc(section.label)+'</small><strong>'+esc(item.name)+'</strong></div>'+
              '<span class="module-icon" aria-hidden="true">'+item.icon+'</span></a>'
            ).join("")+'</div>' : '<p class="page-description">Sin módulos configurados.</p>')+
            '</section>'
          ).join("");
      }else if(module){renderModule(areaId,module);}
      else{renderArea(areaId);}
      document.title=(module?module.name:area?area.label:"Analítica")+" · FlowerLogix";
    }
    window.addEventListener("hashchange",render);
    render();
  </script>
</body>
</html>
